    /* ---- ALEGEREA CUVÂNTULUI, FĂRĂ BARA ANDROID ----
       Textul e `user-select:none` în citire, deci Android nu-și mai pornește
       selecția proprie („Copiază / Distribuie") — care se bătea cu meniul nostru.
       Aflăm singuri cuvântul de sub deget și îl marcăm noi.
       Ține apăsat pe un cuvânt → meniu. Atingi alt cuvânt → se face frază. */
    let alesText='', alesInainte=0, marcajAles=[];

    function curataAles(){
      for(const el of marcajAles){
        const p=el.parentNode;
        if(!p) continue;
        p.replaceChild(document.createTextNode(el.textContent), el);
        p.normalize();
      }
      marcajAles=[]; alesText=''; alesInainte=0;
    }

    // cuvântul (sau fraza) de sub un punct de pe ecran
    function razaLaPunct(x,y){
      let r=null;
      if(document.caretRangeFromPoint) r=document.caretRangeFromPoint(x,y);
      else if(document.caretPositionFromPoint){
        const p=document.caretPositionFromPoint(x,y);
        if(p){ r=document.createRange(); r.setStart(p.offsetNode,p.offset); r.collapse(true); }
      }
      if(!r) return null;
      const nod=r.startContainer;
      if(nod.nodeType!==3 || !corpV.contains(nod)) return null;
      const t=nod.nodeValue;
      let a=r.startOffset, b=r.startOffset;
      const eLitera=c=>c && !/[\s.,;:!?()"„”…—–\[\]]/.test(c);
      while(a>0 && eLitera(t[a-1])) a--;
      while(b<t.length && eLitera(t[b])) b++;
      if(b<=a) return null;
      const raza=document.createRange();
      raza.setStart(nod,a); raza.setEnd(nod,b);
      return raza;
    }

    // A câta apariție e, în textul de pe ecran — reperul după care o găsim
    // în fișier. Sărim peste ce e deja legătură: pe ecran o legătură arată
    // doar eticheta, dar în fișier stă scrisă întreagă, `[[etichetă|țintă]]`.
    // Dacă am număra una și am căuta alta, legătura nouă se scria peste alt
    // cuvânt — uneori chiar în mijlocul unei legături vechi, stricând-o.
    // Aici și în `scrieLegatura` numărăm după aceeași regulă.
    function textDeDinainte(nod, offset){
      let s='';
      const plimbare=document.createTreeWalker(corpV, NodeFilter.SHOW_TEXT);
      let n;
      while((n=plimbare.nextNode())){
        const p=n.parentNode;
        const eLeg = p && p.closest && p.closest('.leg');
        if(n===nod){ if(!eLeg) s+=n.nodeValue.slice(0, offset); break; }
        if(!eLeg) s+=n.nodeValue;
      }
      return s;
    }
    function catAparitiiInainte(raza, text){
      let n=0;
      try{
        const dinainte=textDeDinainte(raza.startContainer, raza.startOffset);
        let i=0;
        while((i=dinainte.indexOf(text,i))>=0){ n++; i+=text.length; }
      }catch(e){}
      return n;
    }

    // marchează vizual ce ai ales (nu folosim selecția browserului)
    function arataAles(raza){
      curataAles();
      const text=raza.toString().trim();
      if(!text) return false;
      alesText=text;
      alesInainte=catAparitiiInainte(raza, text);
      try{
        const sp=document.createElement('span');
        sp.className='ales';
        sp.style.cssText='background:'+prefViz.accent+'55;border-radius:3px;padding:0 1px';
        raza.surroundContents(sp);
        marcajAles=[sp];
      }catch(e){
        // fraza trece peste mai multe bucăți: marcăm fiecare bucată în parte
        try{
          const continut=raza.extractContents();
          const sp=document.createElement('span');
          sp.className='ales';
          sp.style.cssText='background:'+prefViz.accent+'55;border-radius:3px;padding:0 1px';
          sp.appendChild(continut);
          raza.insertNode(sp);
          marcajAles=[sp];
        }catch(e2){ marcajAles=[]; }
      }
      return true;
    }

    // ---- meniul pentru un cuvânt ales (creare de legătură) ----
    function meniulCuvantului(x,y){
      root.querySelectorAll('.leg-meniu').forEach(el=>el.remove());
      const m=document.createElement('div');
      m.className='leg-meniu';
      m.style.cssText='position:absolute;z-index:45;background:#161b22;color:#c9d1d9;'+
        'border:1px solid #30363d;border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.5);'+
        'padding:5px;min-width:210px;display:flex;flex-direction:column;gap:2px';
      function buton(text, culoare, laApasare){
        const b=document.createElement('button');
        b.textContent=text;
        b.style.cssText='background:none;border:none;text-align:left;padding:11px 13px;'+
          'font:inherit;font-size:.88rem;border-radius:7px;color:'+culoare+';cursor:pointer';
        b.addEventListener('click', ev=>{ ev.stopPropagation(); m.remove(); laApasare(); });
        return b;
      }
      const scurt = alesText.length>28 ? alesText.slice(0,28)+'…' : alesText;
      const cap=document.createElement('div');
      cap.textContent='„'+scurt+'"';
      cap.style.cssText='padding:8px 13px 6px;font-size:.8rem;color:#8b949e;border-bottom:1px solid #21262d;margin-bottom:3px';
      m.appendChild(cap);
      // Ce ai ales, prins în clipa asta. Butoanele nu mai citesc `alesText`
      // când sunt apăsate: între deschiderea meniului și atingerea butonului
      // se poate strecura o curățare, iar atunci se scria o legătură goală.
      const alegerea={text:alesText, inainte:alesInainte, dinEditor:false};
      m.appendChild(buton('🔗 Leagă spre alt fișier', prefViz.accent, ()=>{
        alegeTinta(alegerea);
      }));
      m.appendChild(buton('↳ Leagă în fișierul acesta', prefViz.accent, ()=>{
        alegeLoculAici(alegerea);
      }));
      m.appendChild(buton('📋 Copiază', '#c9d1d9', ()=>{
        try{ navigator.clipboard.writeText(alegerea.text); }catch(e){}
        curataAles();
      }));
      m.appendChild(buton('renunță', '#8b949e', ()=>curataAles()));
      root.appendChild(m);
      asazaMeniu(m, x, y);
      inchideLaAtingereInAfara(m, ()=>curataAles());
      // atingerea altui cuvânt extinde alegerea la o frază
      const extinde=ev=>{
        if(!document.contains(m)){ corpV.removeEventListener('pointerdown', extinde, true); return; }
        if(m.contains(ev.target)) return;
        const alta=razaLaPunct(ev.clientX, ev.clientY);
        if(!alta) return;
        ev.preventDefault(); ev.stopPropagation();
        const primul=marcajAles[0];
        if(primul){
          const total=document.createRange();
          try{
            total.setStartBefore(primul);
            total.setEnd(alta.endContainer, alta.endOffset);
            if(total.toString().trim().length>alesText.length && total.toString().length<300){
              // scoatem marcajul vechi înainte să-l cuprindem pe cel nou
              const p=primul.parentNode;
              p.replaceChild(document.createTextNode(primul.textContent), primul);
              p.normalize();
              marcajAles=[];
              const dinNou=document.createRange();
              dinNou.setStart(total.startContainer, total.startOffset);
              dinNou.setEnd(total.endContainer, total.endOffset);
              arataAles(dinNou);
              m.remove();
              meniulCuvantului(ev.clientX, ev.clientY);
              return;
            }
          }catch(e){}
        }
      };
      corpV.addEventListener('pointerdown', extinde, true);
      m.addEventListener('remove', ()=>corpV.removeEventListener('pointerdown', extinde, true));
      setTimeout(()=>{
        const obs=new MutationObserver(()=>{ if(!root.contains(m)){ corpV.removeEventListener('pointerdown', extinde, true); obs.disconnect(); } });
        obs.observe(root, {childList:true});
      },0);
    }

    function asazaMeniu(m, x, y){
      try{
        const dr=root.getBoundingClientRect();
        let sus=y-dr.top+10, stanga=x-dr.left-20;
        // meniul are acum un rând în plus (legătura în același fișier)
        if(sus+240>root.clientHeight) sus=Math.max(6, y-dr.top-250);
        stanga=Math.max(8, Math.min(stanga, root.clientWidth-220));
        m.style.top=sus+'px'; m.style.left=stanga+'px';
      }catch(e){ m.style.top='60px'; m.style.left='20px'; }
    }
    /* Închiderea la atingere în afară.
       Ascultătorul stă pe `document`, în capturare, și se scotea singur DOAR
       când chiar apuca să se declanșeze. Un meniu închis altfel (prin buton,
       sau măturat de meniul următor) își lăsa ascultătorul agățat de pagină.
       La meniul următor, apăsarea pe un buton trecea întâi prin ascultătorul
       vechi: meniul lui nu mai era în pagină, butonul nu era nici în corpul
       textului, deci socotea că ai atins „în afară" și curăța alegerea — cu o
       clipă înainte ca butonul să apuce să citească `alesText`. De aici
       legătura scrisă cu eticheta goală, la începutul fișierului.
       Acum, un ascultător al cărui meniu nu mai e în pagină pleacă în tăcere. */
    function inchideLaAtingereInAfara(m, laInchidere){
      setTimeout(()=>{
        const inafara=ev=>{
          if(!document.contains(m)){                // meniul lui s-a dus demult
            document.removeEventListener('pointerdown', inafara, true);
            return;
          }
          if(m.contains(ev.target)) return;
          if(corpV.contains(ev.target)) return;   // atingerile din text au rolul lor
          m.remove();
          if(laInchidere) laInchidere();
          document.removeEventListener('pointerdown', inafara, true);
        };
        document.addEventListener('pointerdown', inafara, true);
      }, 80);
    }

    // ---- apăsare lungă pe text: alege cuvântul ----
    // Așteptăm 440 ms, nu 520: Android își pornește gesturile lui pe la 500,
    // iar cine ajungea al doilea rămânea fără nimic.
    let cronoText=null, punctApasare=null, candApasat=0;
    function alegeSubDeget(){
      cronoText=null;
      if(!punctApasare) return;
      const raza=razaLaPunct(punctApasare.x, punctApasare.y);
      if(!raza) return;
      if(!arataAles(raza)) return;
      if(navigator.vibrate){ try{ navigator.vibrate(18); }catch(e){} }
      meniulCuvantului(punctApasare.x, punctApasare.y);
    }
    corpV.addEventListener('pointerdown', ev=>{
      if(mod==='editare') return;
      if(ev.target.closest && ev.target.closest('.leg')) return;   // legăturile au meniul lor
      if(ev.target.closest && ev.target.closest('.leg-meniu')) return;
      punctApasare={x:ev.clientX, y:ev.clientY};
      candApasat=Date.now();
      clearTimeout(cronoText);
      cronoText=setTimeout(alegeSubDeget, 440);
    }, true);
    const opresteCrono=()=>{ clearTimeout(cronoText); cronoText=null; };
    corpV.addEventListener('pointerup', opresteCrono);
    corpV.addEventListener('pointermove', ev=>{
      if(!punctApasare || !cronoText) return;
      if(Math.abs(ev.clientX-punctApasare.x)>10 || Math.abs(ev.clientY-punctApasare.y)>10) opresteCrono();
    });
    // Sistemul poate rupe șirul de atingeri când pornește un gest de-al lui
    // (selecție, tras, derulare). Dacă degetul stătea pe loc și apăsarea era
    // aproape gata, o ducem noi la capăt — altfel cuvântul rămânea marcat,
    // fără meniu, exact plângerea „țin apăsat și nu apare caseta".
    corpV.addEventListener('pointercancel', ()=>{
      if(cronoText && Date.now()-candApasat>300){ clearTimeout(cronoText); alegeSubDeget(); }
      else opresteCrono();
    });
    corpV.addEventListener('contextmenu', ev=>{ if(mod!=='editare') ev.preventDefault(); });

    // scrie legătura în text, exact peste bucata aleasă.
    // `tintaFis` e înregistrarea fișierului-țintă, ca să putem lega și înapoi.
    // prima apariție liberă a unui text (una care nu e deja înăuntrul unei
    // legături), sărind peste primele `inainte` apariții libere
    function aparitieLibera(text, cautat, inainte){
      if(!cautat) return -1;          // fără text, `indexOf` întoarce 0 și scria la începutul fișierului
      let de=0, sarite=0, p;
      while((p=text.indexOf(cautat, de))>=0){
        de=p+cautat.length;
        if(inLegatura(text, p)) continue;
        if(sarite>=(inainte||0)) return p;
        sarite++;
      }
      return -1;
    }

    async function scrieLegatura(sel, tinta, loc, tintaFis, pozAleasa){
      if(!sel || !sel.text){ instiintare('S-a pierdut cuvântul ales. Ține apăsat din nou pe el.'); return; }
      const inlocuire='[['+sel.text+'|'+tinta+(loc?('#'+loc):'')+']]';
      let text=f.continut||'';
      if(sel.dinEditor){
        text=text.slice(0,sel.start)+inlocuire+text.slice(sel.sfarsit);
      } else {
        // știm A CÂTA apariție liberă e (numărată în clipa alegerii)
        let poz=aparitieLibera(text, sel.text, sel.inainte||0);
        // dacă numărătoarea n-a nimerit (formatare între cuvinte), luăm
        // prima apariție liberă: tot mai bine decât să nu se scrie nimic
        if(poz<0) poz=aparitieLibera(text, sel.text, 0);
        if(poz<0){
          alert('Nu găsesc textul ales în fișier — probabil are marcaje de formatare, sau e deja parte dintr-o legătură.\n\nÎncearcă din modul de scriere (✎).');
          return;
        }
        text=text.slice(0,poz)+inlocuire+text.slice(poz+sel.text.length);
      }
      f.continut=text;
      await Depozit.scrie(f);

      // ---- CELĂLALT CAPĂT ----
      // Legăm și cuvântul din fișierul-țintă înapoi spre acesta, ca amândouă
      // să fie atingibile. Altfel un capăt era legătură, celălalt text simplu
      // — și mai târziu, la ștergere, „se desface doar dintr-o parte", fiindcă
      // partea cealaltă nu existase niciodată.
      let ambele=false, deCe='';
      if(loc && tintaFis){
        try{
          // recitim ținta chiar acum: copia din listă poate fi veche
          const tf=await Depozit.gaseste(tintaFis.cale) || tintaFis;
          const tt=tf.continut||'';
          // exact locul pe care l-ai ales din listă, dacă textul n-a fost
          // schimbat între timp. Înainte luam mereu PRIMA apariție a
          // cuvântului: dacă aceea era deja legătură, capătul de întoarcere
          // nu se mai scria — în tăcere.
          let undeE=-1;
          if(typeof pozAleasa==='number' &&
             tt.slice(pozAleasa, pozAleasa+loc.length)===loc &&
             !inLegatura(tt, pozAleasa)) undeE=pozAleasa;
          else undeE=aparitieLibera(tt, loc, 0);
          if(undeE>=0){
            const inapoi='[['+loc+'|'+f.cale+'#'+sel.text+']]';
            tf.continut=tt.slice(0,undeE)+inapoi+tt.slice(undeE+loc.length);
            await Depozit.scrie(tf);
            improspateazaFereastra(tf.cale);
            ambele=true;
          } else {
            deCe='„'+loc+'" e deja parte dintr-o legătură în '+tf.cale;
          }
        }catch(e){
          deCe='n-am putut scrie în '+tintaFis.cale;
          console.warn('Nu am putut lega înapoi în '+tintaFis.cale, e);
        }
      } else if(!loc){
        deCe='ai ales începutul fișierului, nu un cuvânt anume';
      }

      curataAles();
      randeazaCorp(false);
      // spunem pe față dacă a ieșit legătură în ambele sensuri sau doar într-unul
      randeazaIntrari();
      if(ambele) instiintare('Legat în ambele fișiere.');
      else instiintare('Legat doar aici — '+(deCe||'fără capăt de întoarcere')+'.');
    }

    // cutia de jos, folosită de ambii pași
    function cutiaDeAles(titluText){
      const acoperis=document.createElement('div');
      acoperis.className='leg-alegere';
      acoperis.style.cssText='position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);'+
        'display:flex;flex-direction:column;justify-content:flex-end';
      const cutie=document.createElement('div');
      cutie.style.cssText='background:#161b22;color:#c9d1d9;border-top:1px solid #30363d;'+
        'max-height:78%;display:flex;flex-direction:column;'+
        'padding:14px 16px calc(env(safe-area-inset-bottom,0) + 14px)';
      const titlu=document.createElement('div');
      titlu.textContent=titluText;
      titlu.style.cssText='font-size:.85rem;font-weight:600;margin-bottom:10px;line-height:1.4';
      const camp=document.createElement('input');
      camp.type='search'; camp.autocomplete='off'; camp.spellcheck=false;
      camp.style.cssText='width:100%;background:#0d1117;border:1px solid #30363d;border-radius:9px;'+
        'padding:10px 12px;color:#c9d1d9;font-size:.95rem;outline:none;margin-bottom:10px';
      const lista=document.createElement('div');
      lista.style.cssText='overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1';
      const renunta=document.createElement('div');
      renunta.textContent='renunță';
      renunta.style.cssText='text-align:center;color:#8b949e;font-size:.82rem;padding:12px 0 2px;cursor:pointer';
      cutie.appendChild(titlu); cutie.appendChild(camp); cutie.appendChild(lista); cutie.appendChild(renunta);
      acoperis.appendChild(cutie); root.appendChild(acoperis);
      const inchide=()=>acoperis.remove();
      renunta.addEventListener('click', inchide);
      acoperis.addEventListener('click', e=>{ if(e.target===acoperis) inchide(); });
      return {acoperis, cutie, camp, lista, inchide};
    }
    function randNimic(lista, text){
      const g=document.createElement('div');
      g.style.cssText='color:#8b949e;font-size:.84rem;padding:14px 2px;line-height:1.5';
      g.textContent=text;
      lista.appendChild(g);
    }

    // pasul 1: care fișier
    async function alegeTinta(sel){
      const scurt=sel.text.length>40 ? sel.text.slice(0,40)+'…' : sel.text;
      const c=cutiaDeAles('„'+scurt+'"  →  spre care fișier?');
      c.camp.placeholder='caută fișierul…';
      const toate=(await Depozit.toate())
        .filter(x=>x.tip!=='folder' && !x.ascuns && !/^__/.test(x.cale) && x.cale!==f.cale);
      function randeaza(filtru){
        c.lista.innerHTML='';
        const q=Cautare.simplu(filtru||'');
        const vazute=toate.filter(x=>!q || Cautare.simplu(x.cale).includes(q)).slice(0,60);
        if(!vazute.length){ randNimic(c.lista,'Niciun fișier.'); return; }
        for(const x of vazute){
          const r=document.createElement('div');
          r.textContent=x.cale;
          r.style.cssText='padding:11px 4px;border-bottom:1px solid #21262d;font-size:.9rem;cursor:pointer';
          r.addEventListener('click',()=>{ c.inchide(); alegeLocul(sel, x); });
          c.lista.appendChild(r);
        }
      }
      c.camp.addEventListener('input',()=>randeaza(c.camp.value));
      randeaza('');
    }

    // ---- LEGĂTURĂ ÎN ACELAȘI FIȘIER: [[cuvintele tale|#loc]] ----
    // Aceeași pastilă, dar ținta e aici, pe pagină. N-are capăt de întoarcere:
    // ar fi o legătură a fișierului cu el însuși, iar cele două capete s-ar
    // căuta unul pe altul la fiecare ștergere.
    async function scrieLegaturaInterna(sel, loc){
      if(!sel || !sel.text){ instiintare('S-a pierdut cuvântul ales. Ține apăsat din nou pe el.'); return; }
      let text=f.continut||'';
      let poz=aparitieLibera(text, sel.text, sel.inainte||0);
      if(poz<0) poz=aparitieLibera(text, sel.text, 0);
      if(poz<0){
        alert('Nu găsesc textul ales în fișier — probabil are marcaje de formatare, sau e deja parte dintr-o legătură.\n\nÎncearcă din modul de scriere (✎).');
        return;
      }
      text=text.slice(0,poz)+'[['+sel.text+'|#'+loc+']]'+text.slice(poz+sel.text.length);
      f.continut=text;
      await Depozit.scrie(f);
      curataAles();
      randeazaCorp(false);
      randeazaIntrari();
      instiintare('Legat aici, spre „'+loc+'".');
    }

    function alegeLoculAici(sel){
      const scurt=sel.text.length>40 ? sel.text.slice(0,40)+'…' : sel.text;
      const c=cutiaDeAles('„'+scurt+'"  →  spre ce loc din fișierul acesta?');
      c.camp.placeholder='caută un cuvânt din pagina asta…';
      const brut=f.continut||'';
      // unde stă chiar bucata pe care o facem legătură: n-are rost să trimită
      // la ea însăși
      const aici=aparitieLibera(brut, sel.text, sel.inainte||0);

      function randeaza(filtru){
        c.lista.innerHTML='';
        const q=(filtru||'').trim();
        if(q.length<2){ randNimic(c.lista,'Scrie două litere ca să vezi unde apar în fișierul acesta.'); return; }
        const tipar=Cautare.tiparPentru(q);
        const gasite=(tipar?Cautare.potriviriIn(brut, tipar, 30):[])
          .filter(([a,b])=> !inLegatura(brut,a) &&
                            !(aici>=0 && a<aici+sel.text.length && b>aici));
        if(!gasite.length){ randNimic(c.lista,'Nu apare în altă parte a fișierului, ca text liber.'); return; }
        // toate aparițiile aceluiași cuvânt duc la aceeași legătură, [[…|#cuvânt]];
        // săritura ajunge la prima din pagină. Lista e aici ca să vezi unde e.
        for(const [a,b] of gasite){
          const ctx=brut.slice(Math.max(0,a-40), Math.min(brut.length,b+40)).replace(/\s+/g,' ');
          const r=document.createElement('div');
          r.style.cssText='padding:10px 4px;border-bottom:1px solid #21262d;font-size:.84rem;cursor:pointer;line-height:1.5';
          r.textContent='…'+ctx+'…';
          r.addEventListener('click',()=>{ c.inchide(); scrieLegaturaInterna(sel, brut.slice(a,b)); });
          c.lista.appendChild(r);
        }
      }
      c.camp.addEventListener('input',()=>randeaza(c.camp.value));
      randeaza('');
      setTimeout(()=>c.camp.focus(), 150);
    }

    // pasul 2: spre ce loc din fișierul acela
    function alegeLocul(sel, tinta){
      const c=cutiaDeAles('În „'+tinta.cale+'" — spre ce loc?');
      c.camp.placeholder='caută un cuvânt din fișierul țintă…';
      const laInceput=document.createElement('div');
      laInceput.textContent='↦ spre începutul fișierului';
      laInceput.style.cssText='padding:11px 4px;border-bottom:1px solid #21262d;cursor:pointer;'+
        'font-size:.9rem;color:'+prefViz.accent;
      c.cutie.insertBefore(laInceput, c.lista);
      laInceput.addEventListener('click',()=>{ c.inchide(); scrieLegatura(sel, tinta.cale, '', null); });

      function randeaza(filtru){
        c.lista.innerHTML='';
        const q=(filtru||'').trim();
        if(q.length<2){ randNimic(c.lista,'Scrie două litere ca să vezi unde apar în „'+tinta.cale+'".'); return; }
        const tipar=Cautare.tiparPentru(q);
        const brut=tinta.continut||'';
        const gasite=tipar?Cautare.potriviriIn(brut, tipar, 30):[];
        if(!gasite.length){ randNimic(c.lista,'Nu apare în fișierul țintă.'); return; }
        for(const [a,b] of gasite){
          const ctx=brut.slice(Math.max(0,a-40), Math.min(brut.length,b+40)).replace(/\s+/g,' ');
          const r=document.createElement('div');
          r.style.cssText='padding:10px 4px;border-bottom:1px solid #21262d;font-size:.84rem;cursor:pointer;line-height:1.5';
          r.textContent='…'+ctx+'…';
          r.addEventListener('click',()=>{ c.inchide(); scrieLegatura(sel, tinta.cale, brut.slice(a,b), tinta, a); });
          c.lista.appendChild(r);
        }
      }
      c.camp.addEventListener('input',()=>randeaza(c.camp.value));
      randeaza('');
      setTimeout(()=>c.camp.focus(), 150);
    }


    aplica();
    randeazaCorp(false);   // conținutul se construiește o singură dată, fără să sară tastatura
    randeazaIntrari();

    // La revenire (dintr-o legătură sau dintr-un rezultat de căutare): închidem
    // panoul de aspect, dacă rămăsese deschis, și evidențiem ce s-a cerut acum.
    laReafisare=async(nou)=>{
      panou.classList.remove('deschis');
      // Recitim fișierul de pe disc. Fereastra ține în memorie propria copie;
      // dacă între timp s-a scris în el din altă parte (de pildă legătura
      // inversă, scrisă din fișierul celălalt), copia noastră e veche — n-am
      // vedea schimbarea, iar salvarea automată de aici ar șterge-o.
      try{
        const proaspat=await Depozit.gaseste(f.cale);
        if(proaspat && typeof proaspat.continut==='string') f.continut=proaspat.continut;
      }catch(e){ console.warn('Nu am putut reciti '+f.cale, e); }
      const cerut=nou && nou.evidentiaza;
      if(cerut!==undefined) evidentiaza=cerut;
      randeazaCorp(false);
      randeazaIntrari();
    };
    // La închidere, salvăm imediat ce n-a apucat să se scrie. Fără asta, dacă
    // închideai fereastra în cele câteva zecimi dinaintea salvării automate,
    // ultimele cuvinte se pierdeau — exact cuvintele la care tocmai lucrai.
    return ()=>{
      if(salvTimer){
        clearTimeout(salvTimer);
        Depozit.scrie(f).catch(e=>console.warn('Nu am putut salva la închidere:', e));
      }
    };
  },{evidentiaza},{appId:'viz:'+f.cale, iconita:'▢',
                   laReafisare:(nou)=>{ if(laReafisare) laReafisare(nou); }});
}



function ruleazaHtml(nume, cod, fisierDeschis){
  ruleazaOaspete(nume, cod, fisierDeschis||null);
}

/* ===================== APLICAȚIA: APLICAȚII (.html) ===================== */
Nucleu.inregistreaza({
  id:'aplicatii', nume:'Aplicații', iconita:'▷',
  montare(corp){
    const root=document.createElement('div');
    root.className='fisiere';
    corp.appendChild(root);

    // input ascuns pentru alegătorul de fișiere Android
    const alegator=document.createElement('input');
    alegator.type='file';
    alegator.accept='.html,.htm,text/html';
    alegator.style.display='none';
    root.appendChild(alegator);

    alegator.addEventListener('change',async()=>{
      const fis=alegator.files[0];
      if(!fis) return;
      const cod=await fis.text();
      const nume=fis.name;
      await Depozit.scrie({cale:nume,tip:'html',continut:cod,creat:Date.now()});
      alegator.value='';
      randeaza();
    });

    randeaza();

    async function randeaza(){
      const toate=await Depozit.toate();
      const apps=toate.filter(f=>f.tip==='html');
      root.querySelectorAll('.cale-bar,.rand,.gol,.buton-adauga').forEach(x=>x.remove());

      const buton=document.createElement('div');
      buton.className='buton-adauga';
      buton.style.cssText='margin:14px 18px;padding:14px;border:1px dashed var(--linie-clar);border-radius:12px;text-align:center;color:var(--accent);cursor:pointer;font-size:.92rem';
      buton.textContent='＋  Adaugă o aplicație (.html)';
      buton.addEventListener('click',()=>alegator.click());
      root.appendChild(buton);

      if(!apps.length){
        const g=document.createElement('div');
        g.className='gol';
        g.innerHTML='Nicio aplicație încă.\nApasă butonul de sus și alege un fișier .html din telefon.\nSe va rula aici, înăuntru, offline.';
        root.appendChild(g);
        return;
      }
      apps.sort((a,b)=>a.cale.localeCompare(b.cale));
      const deplineAcum=()=>(Memorie.ia().aplicatiiDeplin||{});
      for(const a of apps){
        const r=document.createElement('div');
        r.className='rand';
        const eDeplin=!!deplineAcum()[a.cale];
        r.innerHTML=`<span class="ig">▷</span>
          <div class="info"><div class="n">${escHtml(a.cale)}</div>
          <div class="m">aplicație · ${volumFis(a.continut)}${eDeplin?' · <span style="color:var(--accent-cald)">acces deplin</span>':' · izolată'}</div></div>
          <span class="scut-app" title="acces la sistem" style="padding:6px 8px;color:${eDeplin?'var(--accent-cald)':'var(--text-stins)'}">⛨</span>
          <span class="sterge-app" style="color:var(--text-stins);padding:6px 10px">✕</span>`;
        r.querySelector('.info').addEventListener('click',()=>ruleazaHtml(a.cale,a.continut));
        r.querySelector('.ig').addEventListener('click',()=>ruleazaHtml(a.cale,a.continut));
        r.querySelector('.scut-app').addEventListener('click',async(e)=>{
          e.stopPropagation();
          const harta={...deplineAcum()};
          if(harta[a.cale]){
            delete harta[a.cale];
            await Memorie.salveaza({aplicatiiDeplin:harta});
            alert('„'+a.cale+'" revine la izolare.\nDacă are nevoie de IndexedDB, s-ar putea să nu mai pornească.');
          } else {
            const ok=confirm('Dai „'+a.cale+'" acces deplin la sistem?\n\n'+
              'PORNEȘTE aplicațiile care au nevoie de IndexedDB sau de Workeri.\n\n'+
              'Dar de atunci aplicația poate citi TOATE fișierele tale, decriptate, '+
              'și cheia master din memorie. Dă acces deplin numai unei aplicații '+
              'despre care știi că nu atinge internetul.');
            if(!ok) return;
            harta[a.cale]=true;
            await Memorie.salveaza({aplicatiiDeplin:harta});
            alert('Gata. Închide fereastra aplicației și deschide-o din nou.');
          }
          randeaza();
        });
        r.querySelector('.sterge-app').addEventListener('click',async(e)=>{
          e.stopPropagation();
          await Depozit.sterge(a.cale);
          randeaza();
        });
        root.appendChild(r);
      }
    }
  }
});

/* ===================== APLICAȚIA: CAUTĂ =====================
   Un singur câmp peste tot depozitul. Fiecare potrivire arată contextul,
   iar tap-ul deschide fișierul chiar la fraza găsită. */
Nucleu.inregistreaza({
  id:'cauta', nume:'Caută', iconita:'⌕',
  montare(corp){
    const root=document.createElement('div');
    root.style.cssText='flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden';
    root.innerHTML=`
      <div class="ct-sus" style="flex:0 0 auto;padding:14px 14px 10px;border-bottom:1px solid var(--linie)">
        <input class="ct-camp" type="search" placeholder="caută un cuvânt sau o frază…"
          autocomplete="off" autocapitalize="off" spellcheck="false"
          style="width:100%;background:var(--fundal-2);border:1px solid var(--linie);
                 border-radius:10px;padding:12px 14px;color:var(--text);font-size:1rem;outline:none">
        <div class="ct-stare" style="font-size:.76rem;color:var(--text-stins);margin-top:8px;min-height:1.1em"></div>
      </div>
      <div class="ct-jos" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 30px"></div>`;
    corp.appendChild(root);

    const camp=root.querySelector('.ct-camp');
    const stare=root.querySelector('.ct-stare');
    const lista=root.querySelector('.ct-jos');
    let ultima='', temporizator=null;

    (async()=>{
      if(!Cautare.esteGata()){
        stare.textContent='se pregătește indexul…';
        const s=await Cautare.construieste();
        stare.textContent=s.fisiere+' fișiere, '+s.cuvinte+' cuvinte distincte.';
      } else {
        stare.textContent=Cautare.statistici().cuvinte+' cuvinte în index.';
      }
    })();

    function randeaza(rez, q){
      lista.innerHTML='';
      if(!rez.length){
        const g=document.createElement('div');
        g.style.cssText='padding:30px 18px;color:var(--text-stins);text-align:center;font-size:.9rem';
        g.textContent='Nimic pentru „'+q+'".';
        lista.appendChild(g);
        return;
      }
      for(const r of rez){
        const rand=document.createElement('div');
        rand.style.cssText='padding:12px 16px;border-bottom:1px solid var(--linie);cursor:pointer';

        const cap=document.createElement('div');
        cap.style.cssText='display:flex;align-items:baseline;gap:8px;margin-bottom:5px';
        const nume=document.createElement('span');
        nume.textContent=r.cale;
        nume.style.cssText='color:var(--accent);font-size:.92rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        cap.appendChild(nume);
        if(r.cateOri>1){
          const cnt=document.createElement('span');
          cnt.textContent=r.cateOri+'×';
          cnt.style.cssText='font-size:.72rem;color:var(--text-stins);flex-shrink:0';
          cap.appendChild(cnt);
        }
        rand.appendChild(cap);

        if(r.fragment){
          const ctx=document.createElement('div');
          ctx.style.cssText='font-size:.84rem;color:var(--text-stins);line-height:1.5';
          ctx.appendChild(document.createTextNode(r.fragment.inainte));
          const tare=document.createElement('span');
          tare.textContent=r.fragment.potrivit;
          tare.style.cssText='color:var(--text);background:var(--accent)33;border-radius:3px;padding:0 3px';
          ctx.appendChild(tare);
          ctx.appendChild(document.createTextNode(r.fragment.dupa));
          rand.appendChild(ctx);
        } else if(r.inNume){
          const ctx=document.createElement('div');
          ctx.style.cssText='font-size:.8rem;color:var(--text-stins)';
          ctx.textContent='(găsit în nume)';
          rand.appendChild(ctx);
        }

        rand.addEventListener('click', async()=>{
          const f=await Depozit.gaseste(r.cale);
          if(f) deschideCuApp(f, q);     // se deschide chiar la fraza căutată
        });
        lista.appendChild(rand);
      }
    }

    async function executa(){
      const q=camp.value.trim();
      if(q===ultima) return;
      ultima=q;
      if(!q){ lista.innerHTML=''; stare.textContent=Cautare.statistici().cuvinte+' cuvinte în index.'; return; }
      stare.textContent='caut…';
      const t0=performance.now();
      const rez=await Cautare.cauta(q);
      const ms=Math.round(performance.now()-t0);
      stare.textContent=rez.length ? (rez.length+' fișier(e) · '+ms+' ms') : ('nimic · '+ms+' ms');
      randeaza(rez, q);
    }

    camp.addEventListener('input',()=>{ clearTimeout(temporizator); temporizator=setTimeout(executa, 180); });
    camp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ clearTimeout(temporizator); executa(); camp.blur(); } });
    setTimeout(()=>camp.focus(), 200);

    return ()=>clearTimeout(temporizator);
  }
});

/* ===================== APLICAȚIA: TERMINAL (română, puternic) ===================== */
/* ============================================================
   UTILITARE — unelte grupate, ca meniul Start
   ============================================================ */
Nucleu.inregistreaza({
  id:'utilitare', nume:'Utilitare', iconita:'⚒',
  montare(corp){
    const root=document.createElement('div');
    root.className='util';
    corp.appendChild(root);
    root.innerHTML=`
      <div class="util-file">
        <span class="uf activa" data-g="bani">Bani</span>
        <span class="uf" data-g="legaturi">Legături</span>
        <span class="uf" data-g="doctor">Doctor</span>
      </div>
      <div class="util-corp"></div>`;
    const file=root.querySelector('.util-file');
    const corpU=root.querySelector('.util-corp');

    file.addEventListener('click',e=>{
      const b=e.target.closest('.uf'); if(!b) return;
      file.querySelectorAll('.uf').forEach(x=>x.classList.toggle('activa',x===b));
      randeaza(b.dataset.g);
    });

    function camp(eticheta, placeholder, buton, actiune){
      return `<div class="u-rand">
        <label>${eticheta}</label>
        <div class="u-ctrl">
          <input type="text" placeholder="${placeholder}" data-a="${actiune}">
          <button data-a="${actiune}">${buton}</button>
        </div>
        <div class="u-rez" data-r="${actiune}"></div>
      </div>`;
    }
    function rezultat(actiune, text, cls){
      const r=corpU.querySelector('[data-r="'+actiune+'"]');
      if(r){ r.textContent=text; r.className='u-rez '+(cls||''); }
    }

    async function randeaza(grup){
      corpU.innerHTML='';
      if(grup==='bani'){
        const chelt=(Memorie.ia().cheltuieli)||[];
        const d=new Date(); const lunaAsta=d.getFullYear()+'-'+d.getMonth();
        const ale=chelt.filter(c=>{const x=new Date(c.cand);return (x.getFullYear()+'-'+x.getMonth())===lunaAsta;});
        let bilant='';
        if(!ale.length) bilant='<div class="u-gol">Nicio cheltuială luna asta.</div>';
        else{
          const pe={}; let total=0;
          for(const c of ale){ pe[c.categorie]=(pe[c.categorie]||0)+c.suma; total+=c.suma; }
          bilant='<div class="u-bilant">';
          Object.entries(pe).sort((a,b)=>b[1]-a[1]).forEach(([cat,s])=>{
            const proc=Math.round(s/total*100);
            bilant+=`<div class="u-bar"><span class="u-cat">${escHtml(cat)}</span>
              <span class="u-bara"><i style="width:${proc}%"></i></span>
              <span class="u-suma">${s} (${proc}%)</span></div>`;
          });
          bilant+='<div class="u-total">TOTAL: '+total+'</div></div>';
        }
        corpU.innerHTML =
          camp('Cheltuială (sumă + categorie)','ex: 50 mâncare','Notează','cheltuit') +
          bilant;
      }
      else if(grup==='legaturi'){
        corpU.innerHTML='<div class="u-gol">Se citesc legăturile...</div>';
        corpU.innerHTML=''; await deseneazaLegaturi(corpU);
      }
      else if(grup==='doctor'){
        corpU.innerHTML='<div class="u-gol">Se verifică sistemul...</div>';
        const brute=await Depozit.bruteTot();
        const decriptate=await Depozit.toateNefiltrate();
        const total=brute.length;
        const criptate=brute.filter(f=>Cripto.esteCriptat(f.continut)).length;
        const vechi=brute.filter(f=>typeof f.continut==='string' && f.continut && !Cripto.esteCriptat(f.continut)).length;
        const stricate=decriptate.filter(f=>typeof f.continut==='string' && (
          f.continut==='⚠ eroare la decriptare' || f.continut==='⚠ blocat' || f.continut==='⚠ cheie lipsă'));
        const apps=decriptate.filter(f=>f.tip==='html').length;
        const fisiereReale=decriptate.filter(f=>f.tip!=='folder').length;

        let octeti=0; for(const f of decriptate){ try{octeti+=new Blob([f.continut||'']).size;}catch(e){} }
        const fmtOcteti=b=>b<1024?b+' B':b<1024*1024?(b/1024).toFixed(1)+' KB':(b/(1024*1024)).toFixed(2)+' MB';

        let persistent=null, est=null;
        try{ if(navigator.storage && navigator.storage.persisted) persistent=await navigator.storage.persisted(); }catch(e){}
        try{ if(navigator.storage && navigator.storage.estimate) est=await navigator.storage.estimate(); }catch(e){}

        let html='';

        /* ---- COPIA DE SIGURANȚĂ ----
           Stă prima fiindcă e singurul lucru care te apără de tot deodată:
           de o aplicație scăpată de sub control, de o greșeală de-a ta, și
           de telefonul pierdut — pe ăsta din urmă nimic altceva nu-l acoperă.
           Logos știa să exporte, dar nu ținea minte când. */
        {
          const cand=Memorie.ia().ultimulExport||0;
          const zile=cand?Math.floor((Date.now()-cand)/86400000):null;
          // româna cere „o zi", „3 zile", dar „20 de zile"
          const ziua=n=> n===1?'o zi':(n<20?n+' zile':n+' de zile');
          let culoare='var(--verde, #3fb950)', vorba;
          if(!cand){ culoare='var(--rosu, #f85149)'; vorba='Niciodată. Tot ce e aici trăiește într-un singur loc.'; }
          else if(zile<=7)  vorba='Acum '+(zile===0?'mai puțin de o zi':ziua(zile))+'.';
          else if(zile<=30){ culoare='var(--accent-cald, #d29922)'; vorba='Acum '+ziua(zile)+'.'; }
          else { culoare='var(--rosu, #f85149)'; vorba='Acum '+ziua(zile)+'. E mult.'; }
          html+='<div class="u-rand"><label>Copia de siguranță</label>'+
                '<div class="u-info" style="text-align:left;padding:10px 2px;line-height:1.8">'+
                '<div style="color:'+culoare+';font-size:1.02rem">'+escHtml(vorba)+'</div>'+
                (cand?'<div style="color:var(--text-stins);font-size:.82rem">'+
                      new Date(cand).toLocaleString('ro-RO')+'</div>':'')+
                '<div style="color:var(--text-stins);font-size:.82rem;margin-top:4px">'+
                'Din Terminal: <code>export</code> — descarcă tot, criptat cu parola master.</div>'+
                '</div></div>';
        }
        // ---- criptare ----
        html+='<div class="u-rand"><label>Criptare</label><div class="u-info" style="text-align:left;padding:10px 2px;line-height:2">';
        html+='<div>'+(stricate.length?'⚠️ ':'🔒 ')+'AES-GCM 256 · PBKDF2 310.000 iterații</div>';
        html+='<div>Fișiere criptate: <b style="font-size:1em">'+criptate+'</b> din '+total+'</div>';
        if(vechi>0) html+='<div style="color:var(--accent-cald)">'+vechi+' fișier(e) vechi, încă necriptate — se vor cripta la următoarea salvare</div>';
        html+='</div></div>';

        // ---- fișiere corupte ----
        html+='<div class="u-rand"><label>Fișiere corupte</label>';
        if(!stricate.length){
          html+='<div class="u-info" style="text-align:left;padding:10px 2px">✓ Niciunul. Toate fișierele se decriptează corect.</div>';
        } else {
          html+='<div class="u-nota" style="color:var(--rosu)">'+stricate.length+' fișier(e) nu se pot decripta (parolă schimbată greșit, date corupte, sau salvate cu altă cheie).</div>';
          html+='<div class="u-lista" data-corupte></div>';
        }
        html+='</div>';

        // ---- spațiu ----
        html+='<div class="u-rand"><label>Spațiu folosit</label><div class="u-info" style="text-align:left;padding:6px 2px">';
        const totalOrigine = est ? (est.usage||0) : null;
        if(est){
          const used=est.usage||0, quota=est.quota||0;
          const pct=quota?Math.round(used/quota*100):0;
          const fmt=b=>b>=1073741824?(b/1073741824).toFixed(1)+' GB':b>=1048576?(b/1048576).toFixed(1)+' MB':(b/1024).toFixed(0)+' KB';
          html+='<div class="u-bilant"><div class="u-bar"><span class="u-cat">Folosit</span><span class="u-bara"><i style="width:'+Math.min(pct,100)+'%"></i></span><span class="u-suma">'+fmt(used)+' ('+pct+'%)</span></div></div>';
          html+='<div style="color:var(--text-stins);font-size:.82rem;margin-top:4px">Liber: '+fmt(Math.max(0,quota-used))+'</div>';
        } else {
          html+='<div style="color:var(--text-stins)">Browserul nu oferă această informație.</div>';
        }
        html+='<div style="margin-top:8px;color:var(--text-stins);font-size:.82rem">Stocare persistentă: '+
          (persistent===null?'necunoscut':persistent?'✓ activă (browserul nu va șterge singur datele)':'⚠ inactivă — browserul le poate șterge dacă rămâne fără spațiu')+'</div>';
        html+='</div></div>';

        // ---- rămășițe ----
        // Ce a rămas în telefon de la aplicații scoase sau versiuni vechi.
        // Nu sunt în depozitul Logos: nu se criptează, nu intră în export,
        // nu se văd nicăieri — dar ocupă loc.
        html+='<div class="u-rand"><label>Rămășițe</label>'+
              '<div data-ramasite><div class="u-info" style="text-align:left;padding:10px 2px;color:var(--text-stins)">Se caută…</div></div></div>';

        // ---- statistici ----
        // Cât ocupă textul tău, cât ocupă cum stă pe disc, și cât e restul.
        // Fără despărțirea asta, „de trei ori mai mult" e o bănuială: în
        // totalul browserului intră și copia aplicației, și cămările, și
        // bazele altor aplicații.
        let stocat=0;
        for(const f of brute){ try{ stocat+=new Blob([f.continut||'']).size; }catch(e){} }
        let camari=0;
        try{
          for(let i=0;i<localStorage.length;i++){
            const k=localStorage.key(i);
            camari+=(k||'').length+((localStorage.getItem(k)||'').length);
          }
        }catch(e){}
        let copiiApp=0;
        try{
          if(window.caches) for(const n of await caches.keys()){
            const c=await caches.open(n);
            for(const cerere of await c.keys()){
              const r=await c.match(cerere);
              if(r){ try{ copiiApp+=(await r.clone().blob()).size; }catch(e){} }
            }
          }
        }catch(e){}

        const raport=octeti?(stocat/octeti):0;
        html+='<div class="u-rand"><label>Statistici</label><div class="u-info" style="text-align:left;padding:10px 2px;line-height:2">';
        html+='<div>Fișiere: '+fisiereReale+'  ·  Aplicații: '+apps+'</div>';
        html+='<div>Textul tău, în clar: <b style="font-size:1em">'+fmtOcteti(octeti)+'</b></div>';
        html+='<div>Cum stă pe disc, criptat: <b style="font-size:1em">'+fmtOcteti(stocat)+'</b>'+
              (raport?' <span style="color:var(--text-stins)">(×'+raport.toFixed(2)+')</span>':'')+'</div>';
        html+='<div style="color:var(--text-stins)">Copia aplicației: '+fmtOcteti(copiiApp)+
              '  ·  Cămări oaspeți: '+fmtOcteti(camari)+'</div>';
        // Browserul socotește pe origine, nu pe aplicație. Totalul de sus
        // cuprinde și bazele altor aplicații — fără rândul ăsta, rămâne o
        // diferență mare pe care Doctorul o arăta fără s-o lămurească.
        if(totalOrigine!=null){
          const alAltora=Math.max(0, totalOrigine-stocat-copiiApp-camari);
          html+='<div style="margin-top:6px;padding-top:6px;border-top:1px solid #21262d">'+
                'Browserul socotește <b>'+fmtOcteti(totalOrigine)+'</b> pe toată originea.</div>';
          if(alAltora>totalOrigine*0.05)
            html+='<div style="color:var(--accent-cald, #d29922)">Din care '+fmtOcteti(alAltora)+
                  ' nu sunt ale Logos-ului — stau în bazele de la „Rămășițe".</div>';
        }
        html+='</div></div>';

        // ---- cele mai mari ----
        // Totalul singur nu spune nimic. Aproape întotdeauna câteva fișiere
        // mari duc aproape tot, iar restul sunt firimituri.
        const dupaMarime=brute
          .filter(f=>f.tip!=='folder')
          .map(f=>{ let m=0; try{ m=new Blob([f.continut||'']).size; }catch(e){} return {cale:f.cale, tip:f.tip, marime:m}; })
          .sort((a,b)=>b.marime-a.marime).slice(0,6);
        if(dupaMarime.length && dupaMarime[0].marime>0){
          const suma=dupaMarime.reduce((s,f)=>s+f.marime,0);
          html+='<div class="u-rand"><label>Cele mai mari</label>';
          html+='<div class="u-nota">Aceste '+dupaMarime.length+' duc '+
                (stocat?Math.round(suma/stocat*100):0)+'% din tot ce e stocat.</div>';
          html+='<div class="u-info" style="text-align:left;padding:6px 2px;line-height:1.9">';
          // și cine l-a scris — un nume ca `__dc_h:12` nu spune nimic singur
          const numeApps=new Set(decriptate.filter(x=>x.tip!=='folder').map(x=>x.cale));
          for(const f of dupaMarime){
            const stapan=Proprietate.cine(f.cale);
            const semn = stapan ? (numeApps.has(stapan)?stapan:stapan+' — neinstalată') : '';
            html+='<div style="display:flex;gap:10px"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
                  escHtml(f.cale)+(semn?' <span style="color:var(--text-stins);font-size:.86em">· '+escHtml(semn)+'</span>':'')+
                  '</span><span style="color:var(--text-stins);flex:none">'+fmtOcteti(f.marime)+'</span></div>';
          }
          html+='</div></div>';
        }

        corpU.innerHTML=html;
        cautaRamasite(corpU.querySelector('[data-ramasite]'));

        if(stricate.length){
          const gazda=corpU.querySelector('[data-corupte]');
          for(const f of stricate){
            const r=document.createElement('div'); r.className='rand';
            r.innerHTML='<span class="ig">⚠</span><div class="info"><div class="n">'+escHtml(f.cale)+'</div><div class="m">'+escHtml(f.tip)+'</div></div>';
            r.addEventListener('click',()=>deschideCuApp(f));
            gazda.appendChild(r);
          }
        }
      }
      lega();
    }

    /* ---------- RĂMĂȘIȚE ----------
       Browserul ține datele pe origine, nu pe aplicație. O aplicație scoasă
       din Logos își lasă baza în urmă, întreagă și nevăzută: nimic n-o mai
       deschide, nimic n-o mai arată, dar ocupă loc și stă necriptată, fiindcă
       n-a trecut niciodată prin Depozit. Aici le găsim și le scoatem. */
    const octFrumos=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':
                       b>=1048576?(b/1048576).toFixed(1)+' MB':
                       b>=1024?(b/1024).toFixed(0)+' KB':b+' B';

    async function spatiuFolosit(){
      try{
        if(navigator.storage && navigator.storage.estimate)
          return (await navigator.storage.estimate()).usage||0;
      }catch(e){}
      return null;
    }

    // Numără ce e într-o bază străină. Deschidem FĂRĂ număr de versiune:
    // așa o luăm așa cum e, fără s-o schimbăm.
    function cerceteazaBaza(nume){
      return new Promise(gata=>{
        let cerere;
        try{ cerere=indexedDB.open(nume); }catch(e){ gata(null); return; }
        cerere.onerror=()=>gata(null);
        cerere.onblocked=()=>gata(null);
        cerere.onsuccess=async ev=>{
          const bd=ev.target.result;
          const magazii=Array.from(bd.objectStoreNames);
          let total=0;
          for(const m of magazii){
            total+=await new Promise(r=>{
              try{
                const c=bd.transaction(m,'readonly').objectStore(m).count();
                c.onsuccess=()=>r(c.result||0); c.onerror=()=>r(0);
              }catch(e){ r(0); }
            });
          }
          bd.close();
          gata({magazii, total});
        };
      });
    }

    // Cât ocupă o bază străină. Numărul de înregistrări nu spune nimic: 40 de
    // rânduri pot fi 40 de octeți sau 30 de megaocteți. Măsurăm doar la cerere,
    // fiindcă înseamnă citit tot ce e înăuntru.
    function masoaraBaza(nume){
      return new Promise(gata=>{
        let cerere;
        try{ cerere=indexedDB.open(nume); }catch(e){ gata(null); return; }
        cerere.onerror=()=>gata(null);
        cerere.onblocked=()=>gata(null);
        cerere.onsuccess=async ev=>{
          const bd=ev.target.result;
          let total=0;
          try{
            for(const m of Array.from(bd.objectStoreNames)){
              total+=await new Promise(r=>{
                let s=0;
                try{
                  const c=bd.transaction(m,'readonly').objectStore(m).openCursor();
                  c.onsuccess=e2=>{
                    const cur=e2.target.result;
                    if(!cur){ r(s); return; }
                    try{
                      const v=cur.value;
                      if(v instanceof Blob) s+=v.size;
                      else if(v && v.byteLength) s+=v.byteLength;
                      else s+=new Blob([JSON.stringify(v)]).size;
                    }catch(e3){}
                    cur.continue();
                  };
                  c.onerror=()=>r(s);
                }catch(e4){ r(0); }
              });
            }
          }catch(e){}
          bd.close();
          gata(total);
        };
      });
    }

    function stergeBaza(nume){
      return new Promise(gata=>{
        const c=indexedDB.deleteDatabase(nume);
        c.onsuccess=()=>gata(true);
        c.onerror=()=>gata(false);
        // „blocat" înseamnă că o filă deschisă încă ține baza în mână
        c.onblocked=()=>gata('blocat');
      });
    }

    /* Ce știm despre origine — și, mai ales, ce NU știm.
       Aveam aici o listă de „gunoi știut", cu `doccautare3` în ea, fiindcă
       scosesem aplicația Documente. Dar o bază nu e a unei aplicații, e a
       originii: aceleași date sunt acum ale lui doc-offline pornit ca oaspete.
       Logos a strigat „aruncă" peste date vii. O listă de nume ghicite nu
       poate fi de încredere, fiindcă presupune că știm ce rulează — și nu
       știm.
       Regula de-acum: propunem la ștergere DOAR ce a făcut Logos însuși și
       poate dovedi că a rămas fără stăpân. Bazele străine se arată, cu ce e
       înăuntru, fără culoare de alarmă și fără buton la vedere. */
    const BAZE_ALE_NOASTRE={ 'logos_depozit':'depozitul Logos — fișierele tale' };

    async function cautaRamasite(gazda){
      if(!gazda) return;
      const deAruncat=[], folosite=[], straine=[];

      // 1. baze de date din aceeași origine. Nu ghicim a cui e niciuna.
      try{
        if(indexedDB.databases){
          for(const b of await indexedDB.databases()){
            if(!b.name) continue;
            if(BAZE_ALE_NOASTRE[b.name]){ folosite.push({nume:b.name, detaliu:BAZE_ALE_NOASTRE[b.name]}); continue; }
            const c=await cerceteazaBaza(b.name);
            straine.push({fel:'baza', nume:b.name,
              detaliu: c ? (c.total+' înregistrări în: '+c.magazii.join(', ')) : 'nu am putut citi înăuntru'});
          }
        }
      }catch(e){}

      // 2. cămările aplicațiilor-oaspete. Astea le-a făcut Logos, cu numele
      //    aplicației în cheie, deci chiar poate spune care a rămas orfană.
      try{
        const toate=await Depozit.toateNefiltrate();   // și ascunsele: să nu par orfan cine e viu
        const vii=new Set();
        for(const f of toate) if(f.tip!=='folder'){ vii.add(f.cale); vii.add(f.cale.split('/').pop()); }
        for(let i=0;i<localStorage.length;i++){
          const k=localStorage.key(i);
          if(!k || k.indexOf('camara_oaspete_')!==0) continue;
          const numeApp=k.slice('camara_oaspete_'.length);
          const cat=octFrumos((localStorage.getItem(k)||'').length);
          if(vii.has(numeApp)) folosite.push({nume:k, detaliu:'cămara aplicației „'+numeApp+'", care e în depozit · '+cat});
          else deAruncat.push({fel:'camara', nume:k,
                 detaliu:'cămara aplicației „'+numeApp+'", care nu mai e în depozit · '+cat});
        }
      }catch(e){}

      // 3. copiile Logos-ului, făcute de paznicul lui. Cea mai nouă e cea vie.
      try{
        if(window.caches){
          const nume=(await caches.keys()).sort();
          nume.forEach((n,i)=>{
            if(i===nume.length-1) folosite.push({nume:n, detaliu:'copia Logos care rulează acum'});
            else deAruncat.push({fel:'cache', nume:n, detaliu:'copie veche a Logos-ului'});
          });
        }
      }catch(e){}

      // 4. fișiere scrise de aplicații-oaspete care nu mai sunt instalate.
      //    Aici nu ghicim nimic: Logos a însemnat el însuși stăpânul, la
      //    fiecare scriere prin punte. Scoaterea unei aplicații îi scoate
      //    fișierul, nu și ce a scris ea — asta rămânea nevăzut.
      try{
        const harta=Proprietate.harta();
        const brute=await Depozit.bruteTot();
        const marimi={}; for(const f of brute){ try{ marimi[f.cale]=new Blob([f.continut||'']).size; }catch(e){ marimi[f.cale]=0; } }
        const peApp={};
        for(const cale in harta){
          const app=harta[cale];
          if(!app || vii.has(app)) continue;             // aplicația e încă în depozit
          if(!(cale in marimi)) continue;                // fișierul nu mai există
          (peApp[app]=peApp[app]||{cai:[], octeti:0});
          peApp[app].cai.push(cale);
          peApp[app].octeti+=marimi[cale]||0;
        }
        for(const app in peApp){
          const g=peApp[app];
          deAruncat.push({fel:'fisiere', nume:'fișierele aplicației „'+app+'"', cai:g.cai,
            detaliu:g.cai.length+' fișiere scrise de „'+app+'", care nu mai e instalată · '+octFrumos(g.octeti)});
        }
      }catch(e){}

      // 5. fișiere ascunse cu semn străin.
      //    Versiunea asta scrie doar `__stare_logos` și `__ver1:…`. Orice alt
      //    nume cu `__` a fost scris de altceva — cel mai probabil de o
      //    aplicație cu acces deplin, care ajunge la depozit fără punte, deci
      //    fără să lase însemnare de proprietate. `numeSigur()` le refuză
      //    numele, așa că nu se pot atinge nici din Fișiere, nici din terminal:
      //    dacă nu apar aici, nu apar nicăieri.
      try{
        const ALE_NOASTRE=['__stare_logos','__ver1'];
        const brute2=await Depozit.bruteTot();
        const peSemn={};
        for(const f of brute2){
          const cale=f.cale||'';
          if(!cale.startsWith('__')) continue;
          const semn=cale.split(':')[0].replace(/_[a-z]{1,2}$/,'');
          if(ALE_NOASTRE.includes(semn) || ALE_NOASTRE.includes(cale)) continue;
          let m=0; try{ m=new Blob([f.continut||'']).size; }catch(e){}
          (peSemn[semn]=peSemn[semn]||{cai:[], octeti:0});
          peSemn[semn].cai.push(cale); peSemn[semn].octeti+=m;
        }
        for(const semn in peSemn){
          const g=peSemn[semn];
          straine.push({fel:'fisiere', nume:semn+'…  ('+g.cai.length+' fișiere ascunse)', cai:g.cai,
            detaliu:'semn pe care versiunea asta de Logos nu-l scrie · '+octFrumos(g.octeti)});
        }
      }catch(e){}

      // 6. copiile de siguranță ale punții.
      //    Puntea păstrează versiunea dinainte la fiecare scriere a unei
      //    aplicații — plasă bună, dar nu se șterge niciodată, nici măcar
      //    când ștergi originalul. Le-am scos din verificarea de la punctul 5
      //    ca prefix cunoscut, deci erau invizibile cu totul.
      try{
        const brute3=await Depozit.bruteTot();
        const exista=new Set(brute3.map(f=>f.cale));
        const orfane=[], tinute=[];
        let octOrfane=0, octTinute=0;
        for(const f of brute3){
          if(!(f.cale||'').startsWith('__ver1:')) continue;
          let m=0; try{ m=new Blob([f.continut||'']).size; }catch(e){}
          const original=f.cale.slice('__ver1:'.length);
          if(exista.has(original)){ tinute.push(f.cale); octTinute+=m; }
          else { orfane.push(f.cale); octOrfane+=m; }
        }
        if(orfane.length)
          deAruncat.push({fel:'fisiere', nume:'copii de siguranță fără original', cai:orfane,
            detaliu:orfane.length+' copii ale unor fișiere care nu mai există · '+octFrumos(octOrfane)});
        if(tinute.length)
          folosite.push({nume:'__ver1: — '+tinute.length+' copii de siguranță',
            detaliu:'versiunea dinainte a fișierelor scrise de aplicații · '+octFrumos(octTinute)+
                    ' · se aduc înapoi cu „recupereaza"'});
      }catch(e){}

      // 7. însemnări rămase în Memorie.
      //    Risipa e mărunta parte. Un „permit lui X să scrie în Y" rămâne
      //    scris după ce ștergi aplicația X: pui mâine alta cu același nume
      //    și are permisiunea dinainte, fără să te mai întrebe nimeni.
      try{
        const brute4=await Depozit.bruteTot();
        const exista=new Set(brute4.map(f=>f.cale));
        const harta=Proprietate.harta(), granturi=Proprietate.granturi();
        const propMoarte=[], grantMoarte=[];
        for(const cale in harta) if(!exista.has(cale)) propMoarte.push(cale);
        for(const g in granturi){
          const buc=g.split(' → ');
          const app=buc[0], cale=buc.slice(1).join(' → ');
          if(!vii.has(app) || !exista.has(cale)) grantMoarte.push(g);
        }
        if(propMoarte.length)
          deAruncat.push({fel:'proprietari', nume:'însemnări de proprietate fără fișier', chei:propMoarte,
            detaliu:propMoarte.length+' fișiere însemnate care nu mai există'});
        if(grantMoarte.length)
          deAruncat.push({fel:'granturi', nume:'permisiuni rămase de la aplicații scoase', chei:grantMoarte,
            detaliu:grantMoarte.length+' permisiuni care ar reînvia dacă pui altă aplicație cu același nume'});
      }catch(e){}

      deseneazaRamasite(gazda, deAruncat, folosite, straine);
    }

    function deseneazaRamasite(gazda, deAruncat, folosite, straine){
      gazda.innerHTML='';

      function rand(g, strain){
        const r=document.createElement('div');
        r.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #21262d';
        const stanga=document.createElement('div');
        stanga.style.cssText='flex:1;min-width:0';
        stanga.innerHTML='<div style="font-size:.9rem">'+escHtml(g.nume)+'</div>'+
                         '<div style="font-size:.78rem;color:var(--text-stins);margin-top:2px">'+escHtml(g.detaliu)+'</div>';
        r.appendChild(stanga);
        if(strain && g.fel==='baza'){
          const m=document.createElement('button');
          m.textContent='Cât ocupă?';
          m.style.cssText='background:transparent;border:1px solid var(--text-stins, #8b949e);'+
                          'color:var(--text-stins, #8b949e);border-radius:8px;padding:7px 11px;font-size:.8rem;flex:none';
          m.addEventListener('click', async ()=>{
            m.disabled=true; m.textContent='…';
            const oct=await masoaraBaza(g.nume);
            const jos=stanga.lastElementChild;
            if(jos) jos.textContent = g.detaliu + (oct==null?' · n-am putut măsura':' · '+octFrumos(oct));
            m.remove();
          });
          r.appendChild(m);
        }
        const b=document.createElement('button');
        b.textContent='Șterge';
        const culoare = strain ? 'var(--text-stins, #8b949e)' : 'var(--rosu, #f85149)';
        b.style.cssText='background:transparent;border:1px solid '+culoare+';color:'+culoare+
                        ';border-radius:8px;padding:7px 14px;font-size:.84rem;flex:none';
        b.addEventListener('click',()=>aruncaUna(g, b, strain));
        r.appendChild(b);
        return r;
      }

      // ---- ce a făcut Logos și a rămas fără stăpân ----
      if(!deAruncat.length){
        const g=document.createElement('div');
        g.className='u-info'; g.style.cssText='text-align:left;padding:10px 2px';
        g.textContent='✓ Nimic rămas fără stăpân.';
        gazda.appendChild(g);
      } else {
        const n=document.createElement('div');
        n.className='u-nota';
        n.textContent='Făcute de Logos, rămase fără aplicația lor. Astea le poate dovedi.';
        gazda.appendChild(n);
        for(const g of deAruncat) gazda.appendChild(rand(g,false));
      }

      // ---- baze străine: se arată, nu se acuză ----
      if(straine.length){
        const desfa=document.createElement('div');
        desfa.style.cssText='padding:12px 2px;font-size:.82rem;color:var(--text-stins);cursor:pointer;text-decoration:underline;text-underline-offset:3px';
        const eticheta=()=> straine.length+' lucru(ri) pe care Logos nu le-a scris — arată-mi';
        desfa.textContent=eticheta();
        const cutie=document.createElement('div');
        cutie.style.display='none';
        const avert=document.createElement('div');
        avert.className='u-nota';
        avert.textContent='Browserul ține datele pe origine, nu pe aplicație. O aplicație cu acces deplin scrie în depozit fără punte, deci fără să lase însemnare: nu pot ști a cui e fiecare. Uită-te ce e înăuntru înainte de orice.';
        cutie.appendChild(avert);
        for(const g of straine) cutie.appendChild(rand(g,true));
        desfa.addEventListener('click',()=>{
          const arata=cutie.style.display==='none';
          cutie.style.display=arata?'':'none';
          desfa.textContent=arata?'ascunde':eticheta();
        });
        gazda.appendChild(desfa); gazda.appendChild(cutie);
      }

      // ---- în folosință ----
      if(folosite.length){
        const t=document.createElement('div');
        t.style.cssText='padding:14px 2px 4px;font-size:.78rem;color:var(--text-stins);text-transform:uppercase;letter-spacing:.06em';
        t.textContent='În folosință · nu se ating';
        gazda.appendChild(t);
        for(const g of folosite){
          const r=document.createElement('div');
          r.style.cssText='padding:7px 2px;font-size:.82rem;color:var(--text-stins);opacity:.75';
          r.textContent='· '+g.nume+' — '+g.detaliu;
          gazda.appendChild(r);
        }
      }
    }

    async function aruncaUna(g, b, strain){
      const intrebare = strain
        ? 'Ștergi „'+g.nume+'"?\n\n'+g.detaliu+'\n\nNu e o bază a Logos-ului și nu pot ști a cui e. Dacă o folosește vreo aplicație de-a ta, datele ei se pierd. Nu se poate desface.'
        : 'Ștergi „'+g.nume+'"?\n\n'+g.detaliu+'\n\nNu se poate desface.';
      if(!confirm(intrebare)) return;
      b.disabled=true; b.textContent='…';
      const inainte=await spatiuFolosit();
      let reusit=false;
      if(g.fel==='fisiere'){
        let cate=0;
        for(const cale of (g.cai||[])){
          if(await Depozit.sterge(cale)){ cate++; try{ await Proprietate.elibereaza(cale); }catch(e){} }
        }
        reusit = cate>0;
      }
      if(g.fel==='proprietari'){
        try{ for(const cale of (g.chei||[])) await Proprietate.elibereaza(cale); reusit=true; }catch(e){}
      }
      if(g.fel==='granturi'){
        try{
          const gr={...Proprietate.granturi()};
          for(const k of (g.chei||[])) delete gr[k];
          await Memorie.salveaza({granturi:gr});
          reusit=true;
        }catch(e){}
      }
      if(g.fel==='baza')   reusit=await stergeBaza(g.nume);
      if(g.fel==='camara'){ try{ localStorage.removeItem(g.nume); reusit=true; }catch(e){} }
      if(g.fel==='cache'){  try{ reusit=await caches.delete(g.nume); }catch(e){} }
      if(reusit==='blocat'){
        b.disabled=false; b.textContent='Șterge';
        instiintare('Baza e ținută deschisă de altă filă. Închide celelalte file cu Logos și încearcă din nou.');
        return;
      }
      if(!reusit){
        b.disabled=false; b.textContent='Șterge';
        instiintare('N-am putut șterge „'+g.nume+'".');
        return;
      }
      const dupa=await spatiuFolosit();
      const eliberat=(inainte!=null && dupa!=null)?Math.max(0, inainte-dupa):null;
      instiintare('Șters'+(eliberat?' · '+octFrumos(eliberat)+' eliberați':'')+'.');
      randeaza('doctor');
    }

    /* ---------- STAREA LEGĂTURILOR ----------
       Legăturile stau scrise în text, deci se strică odată cu textul: ștergi
       un fișier și rămân trimiteri spre nicăieri, rescrii un paragraf și o
       ancoră rămâne fără cuvânt. Nimic nu te anunța.
       Regula de aici e ca la Rămășițe: reparăm doar ce se poate dovedi. Ținta
       ștearsă n-o dregem singuri — ori desfaci legătura, ori o îndrepți, și
       amândouă sunt hotărâri de-ale tale. */
    const laSimplu=a=>Cautare.simplu(a||'');

    // apare cuvântul în text? și ca text liber, și ca etichetă de legătură —
    // perechea unei legături înfășoară chiar cuvântul-ancoră, deci dacă am
    // număra numai textul liber aș raporta moarte toate ancorele sănătoase
    function ancoraExista(text, loc){
      if(!loc) return true;
      const t=laSimplu(text||''), c=laSimplu(loc);
      return t.indexOf(c)>=0;
    }

    async function adunaLegaturi(){
      // aceeași regulă ca la indexare: numai text scris de tine, nu cod
      const toate=(await Depozit.toate()).filter(f=>Legaturi.eTextDeCitit(f));
      const dupaCale={}; for(const f of toate) dupaCale[f.cale]=f;
      const cheiExistente=new Map();
      for(const f of toate) cheiExistente.set(Legaturi.cheie(f.cale), f);

      const necazuri={tintaLipsa:[], etichetaGoala:[], ancoraMoarta:[], chioapa:[],
                      ambigua:[], numeAmbiguu:[]};
      let total=0;

      // fișiere cu același nume de bază: o trimitere spre ele poate nimeri oriunde
      const peNume={};
      for(const f of toate){
        const k=Legaturi.cheie(f.cale);
        (peNume[k]=peNume[k]||[]).push(f.cale);
      }
      for(const k in peNume) if(peNume[k].length>1)
        necazuri.numeAmbiguu.push({nume:k, cai:peNume[k]});

      for(const f of toate){
        const re=new RegExp(Legaturi.TIPAR.source,'g');
        let m;
        while((m=re.exec(f.continut))){
          total++;
          const brut=m[1];
          const p=Legaturi.despicaTinta(brut.trim());
          const unde={cale:f.cale, brut, parti:p};

          if(!p.eticheta && !p.fisier && !p.loc) continue;
          if(!p.eticheta && p.fisier && !p.loc) { /* [[Fișier]] simplu, e în regulă */ }

          if(brut.indexOf('|')>=0 && !p.eticheta){ necazuri.etichetaGoala.push(unde); continue; }

          // ținta: alt fișier, sau chiar acesta
          const tinta = p.fisier ? cheiExistente.get(Legaturi.cheie(p.fisier)) : f;
          if(p.fisier && !tinta){ necazuri.tintaLipsa.push(unde); continue; }

          // La o legătură în același fișier, ancora s-ar găsi pe sine: [[#libelulă]]
          // conține chiar cuvântul „libelulă". Scoatem legătura din text înainte
          // de a căuta, altfel n-aș raporta niciodată o ancoră internă moartă.
          let caut=tinta.continut||'';
          if(Legaturi.cheie(tinta.cale)===Legaturi.cheie(f.cale))
            caut=caut.slice(0,m.index)+caut.slice(m.index+m[0].length);

          if(p.loc && !ancoraExista(caut, p.loc)){ necazuri.ancoraMoarta.push(unde); continue; }

          if(p.loc && p.fisier){
            // perechea: o legătură din țintă care trimite înapoi aici
            const re2=new RegExp(Legaturi.TIPAR.source,'g');
            let m2, gasit=false;
            while((m2=re2.exec(tinta.continut))){
              const q=Legaturi.despicaTinta(m2[1].trim());
              if(!q.fisier || Legaturi.cheie(q.fisier)!==Legaturi.cheie(f.cale)) continue;
              if(laSimplu(q.eticheta)===laSimplu(p.loc) || laSimplu(q.loc)===laSimplu(p.eticheta)){ gasit=true; break; }
            }
            if(!gasit){ necazuri.chioapa.push(unde); continue; }
          }

          // ancoră care apare de multe ori: săritura merge la prima
          if(p.loc){
            const t=laSimplu(caut), c=laSimplu(p.loc);
            let n=0, i=0;
            while((i=t.indexOf(c,i))>=0){ n++; i+=c.length; if(n>4) break; }
            if(n>4) necazuri.ambigua.push({...unde, cate:n});
          }
        }
      }
      return {total, necazuri, dupaCale, cheiExistente};
    }

    // înlocuiește o singură legătură, exact acolo unde e scrisă
    async function schimbaLegatura(cale, brutVechi, brutNou){
      const f=await Depozit.gaseste(cale); if(!f) return false;
      const vechi='[['+brutVechi+']]';
      const poz=(f.continut||'').indexOf(vechi);
      if(poz<0) return false;
      f.continut=f.continut.slice(0,poz)+(brutNou===null?'':'[['+brutNou+']]')+f.continut.slice(poz+vechi.length);
      await Depozit.scrie(f);
      improspateazaFereastra(cale);
      return true;
    }

    async function deseneazaLegaturi(gazda){
      gazda.innerHTML='<div class="u-gol">Se citesc legăturile...</div>';
      let r;
      try{ r=await adunaLegaturi(); }
      catch(e){ gazda.innerHTML='<div class="u-gol">Nu am putut citi legăturile.</div>'; return; }
      const n=r.necazuri;
      const cate=Object.keys(n).reduce((s,k)=>s+n[k].length,0);
      gazda.innerHTML='';

      const sus=document.createElement('div');
      sus.className='u-rand';
      sus.innerHTML='<label>Țesătura</label><div class="u-info" style="text-align:left;padding:10px 2px;line-height:1.9">'+
        '<div>Legături scrise: <b style="font-size:1em">'+r.total+'</b></div>'+

    function lega(){
      corpU.querySelectorAll('button[data-a]').forEach(b=>{
        b.addEventListener('click',()=>ruleaza(b.dataset.a));
      });
      corpU.querySelectorAll('input[data-a]').forEach(inp=>{
        inp.addEventListener('keydown',e=>{ if(e.key==='Enter') ruleaza(inp.dataset.a); });
      });
    }

    async function ruleaza(a){
      const inp=corpU.querySelector('input[data-a="'+a+'"]');
      const v=inp?inp.value.trim():'';
      try{
        if(a==='calc'){
          if(!/^[\d\s+\-*/().,%]+$/.test(v)) return rezultat(a,'Doar numere și + - * / ( ) %','err');
          rezultat(a, v+' = '+Function('"use strict";return ('+v.replace(/,/g,'.')+')')(), 'ok');
        }
        else if(a==='procent'){
          const m=v.match(/([\d.,]+)\s*(?:%|la suta)?\s*din\s*([\d.,]+)/i);
          if(!m) return rezultat(a,'Scrie: 20 din 150','err');
          const p=parseFloat(m[1].replace(',','.')), t=parseFloat(m[2].replace(',','.'));
          rezultat(a, p+'% din '+t+' = '+(p*t/100), 'ok');
        }
        else if(a==='medie'){
          const nr=v.split(/[\s,]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>!isNaN(x));
          if(!nr.length) return rezultat(a,'Scrie numere separate prin spațiu','err');
          const s=nr.reduce((x,y)=>x+y,0);
          rezultat(a,'Media a '+nr.length+' numere = '+(s/nr.length).toFixed(2)+'   (suma '+s+')','ok');
        }
        else if(a==='conv'){
          const m=v.match(/^([\d.,]+)\s*(\S+)(?:\s+(?:in|în))?\s+(\S+)$/i);
          if(!m) return rezultat(a,'Scrie: 10 km mile','err');
          const val=parseFloat(m[1].replace(',','.')), din=m[2].toLowerCase(), spre=m[3].toLowerCase();
          if(din==='c'&&spre==='f') return rezultat(a, val+'°C = '+(val*9/5+32).toFixed(1)+'°F','ok');
          if(din==='f'&&spre==='c') return rezultat(a, val+'°F = '+((val-32)*5/9).toFixed(1)+'°C','ok');
          const R={'km:mile':0.621371,'mile:km':1.60934,'kg:lb':2.20462,'lb:kg':0.453592,
                   'm:ft':3.28084,'ft:m':0.3048,'cm:inch':0.393701,'inch:cm':2.54,'l:gal':0.264172,'gal:l':3.78541};
          const r=R[din+':'+spre];
          if(!r) return rezultat(a,'Nu știu conversia asta','err');
          rezultat(a, val+' '+din+' = '+(val*r).toFixed(3)+' '+spre,'ok');
        }
        else if(a==='crono'){
          const m=v.match(/^([\d.,]+)\s*(.*)$/);
          if(!m) return rezultat(a,'Scrie: 10 cumpără pâine','err');
          const min=parseFloat(m[1].replace(',','.')), text=m[2]||'';
          if(isNaN(min)||min<=0) return rezultat(a,'Pune un număr de minute','err');
          Temporizatoare.porneste(min, text);
          rezultat(a,'Pornit! Vezi timpul rămas sus, în bară.'+(text?('  ('+text+')'):''),'ok');
          inp.value='';
        }
        else if(a==='sarcina'){
          if(!v) return rezultat(a,'Scrie o sarcină','err');
          let text=v, termen=null;
          const m=text.match(/\s+(?:pana|până)\s+(\S+)\s*$/i);
          if(m){ termen=parseTermenGlobal(m[1]); if(termen) text=text.slice(0,m.index).trim(); }
          const s=(Memorie.ia().sarcini)||[];
          s.push({text,gata:false,creat:Date.now(),termen});
          await Memorie.salveaza({sarcini:s});
          inp.value=''; randeaza('sarcini');
        }
        else if(a==='cheltuit'){
          const m=v.match(/^([\d.,]+)\s+(.+)$/);
          if(!m) return rezultat(a,'Scrie: 50 mâncare','err');
          const suma=parseFloat(m[1].replace(',','.'));
          if(isNaN(suma)) return rezultat(a,'Suma nu e un număr','err');
          const c=(Memorie.ia().cheltuieli)||[];
          c.push({suma, categorie:m[2].trim().toLowerCase(), cand:Date.now()});
          await Memorie.salveaza({cheltuieli:c});
          inp.value=''; randeaza('bani');
        }
        else if(a==='parola'){
          const lung=Math.min(Math.max(parseInt(v)||14,8),40);
          const set='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*';
          let p=''; const rnd=new Uint32Array(lung); crypto.getRandomValues(rnd);
          for(let i=0;i<lung;i++) p+=set[rnd[i]%set.length];
          rezultat(a, p, 'ok mono');
        }
        else if(a==='uuid'){
          rezultat(a, (crypto.randomUUID?crypto.randomUUID():'—'), 'ok mono');
        }
        else if(a==='hex'){
          const n=parseInt(v);
          if(isNaN(n)) return rezultat(a,'Scrie un număr','err');
          rezultat(a, n+' = 0x'+n.toString(16).toUpperCase()+'  = bin '+n.toString(2),'ok mono');
        }
        else if(a==='b64'){
          if(!v) return rezultat(a,'Scrie un text','err');
          rezultat(a, btoa(unescape(encodeURIComponent(v))),'ok mono');
        }
        else if(a==='b64d'){
          try{ rezultat(a, decodeURIComponent(escape(atob(v))),'ok'); }
          catch(e){ rezultat(a,'Nu pot decoda','err'); }
        }
        else if(a==='ts'){
          rezultat(a,'Unix: '+Math.floor(Date.now()/1000)+'   (ms: '+Date.now()+')','ok mono');
        }
      }catch(e){ rezultat(a,'Eroare: '+e.message,'err'); }
    }

    randeaza('bani');
    return ()=>{ if(corpU._opreste) corpU._opreste(); };
  }
});

// parseTermen global (folosit și de Utilitare)
function parseTermenGlobal(cuv){
  const c=(cuv||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const d=new Date(); d.setHours(23,59,0,0);
  if(c==='azi') return d.getTime();
  if(c==='maine'){ d.setDate(d.getDate()+1); return d.getTime(); }
  if(c==='poimaine'){ d.setDate(d.getDate()+2); return d.getTime(); }
  const zile={duminica:0,luni:1,marti:2,miercuri:3,joi:4,vineri:5,sambata:6};
  if(c in zile){ let dif=(zile[c]-d.getDay()+7)%7; if(dif===0)dif=7; d.setDate(d.getDate()+dif); return d.getTime(); }
  const m=c.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],23,59).getTime();
  return null;
}
function dataScurta(ts){
  const d=new Date(ts);
  const zile=['dum','lun','mar','mie','joi','vin','sâm'];
  return zile[d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
}

    function inlocVariabile(text){
      const d=new Date();
      const zile=['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'];
      const ore=d.getHours();
      const salut = ore<12?'Bună dimineața':ore<18?'Bună ziua':'Bună seara';
      const nume=(Memorie.ia().numeUtilizator)||'prietene';
      return (text||'')
        .replace(/\{nume\}/gi, nume)
        .replace(/\{ora\}/gi, String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'))
        .replace(/\{data\}/gi, d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))
        .replace(/\{zi\}/gi, zile[d.getDay()])
        .replace(/\{salut\}/gi, salut);
    }

    // ---- termene: „vineri", „maine", „azi", „2026-07-04" → timestamp (sfârșitul zilei)
    function parseTermen(cuv){
      const c=(cuv||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const d=new Date(); d.setHours(23,59,0,0);
      if(c==='azi') return d.getTime();
      if(c==='maine'){ d.setDate(d.getDate()+1); return d.getTime(); }
      if(c==='poimaine'){ d.setDate(d.getDate()+2); return d.getTime(); }
      const zile={duminica:0,luni:1,marti:2,miercuri:3,joi:4,vineri:5,sambata:6};
      if(c in zile){
        let dif=(zile[c]-d.getDay()+7)%7; if(dif===0) dif=7; // următoarea zi cu numele ăsta
        d.setDate(d.getDate()+dif); return d.getTime();
      }
      const m=c.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if(m){ return new Date(+m[1], +m[2]-1, +m[3], 23,59).getTime(); }
      return null;
    }
    function dataScurta(ts){
      const d=new Date(ts);
      const zile=['dum','lun','mar','mie','joi','vin','sâm'];
      return zile[d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
    }

      async incarca(){
        // deschide selectorul de fișiere al telefonului
        const inp=document.createElement('input');
        inp.type='file'; inp.accept='.json,application/json';
        inp.addEventListener('change',async()=>{
          const file=inp.files[0]; if(!file) return;
          const r=new FileReader();
          r.onload=async()=>{
            let invelis;
            try{ invelis=JSON.parse(r.result); }catch(e){ scrie('Fișierul nu e un backup valid.','err'); return; }
            let pachet=null;
            if(invelis.logos_backup_criptat){
              try{ pachet=JSON.parse(await Cripto.decripteaza(invelis.data)); }
              catch(e){ scrie('Nu am putut decripta backup-ul (parolă greșită sau fișier corupt).','err'); return; }
            } else if(invelis.logos_backup){
              pachet=invelis; // backup vechi, necriptat — îl acceptăm pentru compatibilitate
            }
            if(!pachet || !pachet.logos_backup){ scrie('Nu e un backup Logos.','err'); return; }
            let n=0;
            for(const fis of (pachet.fisiere||[])){ if(fis.tip!=='backup'){ await Depozit.scrie(fis); n++; } }
            if(pachet.memorie){ await Memorie.salveaza(pachet.memorie); }
            scrie('Am adus '+n+' fișier(e) din backup-ul de pe telefon.','cald');
            scrie('Reîncarcă Logos ca să se vadă tot.','stins');
          };
          r.readAsText(file);
        });
        inp.click();
        scrie('Alege fișierul de backup de pe telefon…','stins');
      },

        const vechi=await Depozit.citeste('__ver1:'+nume);

        // doar cifre și operatori — sigur
        if(!/^[\d\s+\-*/().,%]+$/.test(ex)){ scrie('Doar numere și + - * / ( ) % sunt permise.','err'); return; }

          const r=Function('"use strict";return ('+ex.replace(/,/g,'.')+')')();
