/* ---------- mini-Markdown pentru cititor ---------- */
function md2html(md){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return md.trim().split('\n').map(l=>{
    let t=l.trim();
    if(t.startsWith('## '))return '<h2>'+esc(t.slice(3))+'</h2>';
    if(t.startsWith('# '))return '<h1>'+esc(t.slice(2))+'</h1>';
    if(t==='')return '';
    return '<p>'+esc(t).replace(/`(.+?)`/g,'<code>$1</code>')+'</p>';
  }).join('');
}

/* ===================== APLICAȚIA: FIȘIERE ===================== */
Nucleu.inregistreaza({
  id:'fisiere', nume:'Fișiere', iconita:'▤',
  montare(corp){
    const root=document.createElement('div');
    root.className='fisiere';
    corp.appendChild(root);
    let caleCurenta='';   // '' = acasă; 'Jurnal/' = în folderul Jurnal
    // fără meniul nativ Android (căutare pe web) la apăsare lungă
    root.addEventListener('contextmenu',e=>e.preventDefault());
    root._rerandeaza=()=>randeaza();   // ca să reacționeze la schimbarea modului
    root._calea=()=>caleCurenta;       // unde suntem acum (pentru drop din sistem)
    randeaza();

    // ---- apăsare lungă (touch) SAU clic-dreapta (laptop) ----
    function apasareLunga(el, fn){
      let t=null,x0=0,y0=0,eDeget=false,amDeschisMeniu=false;
      el.style.webkitTouchCallout='none';
      el.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse' && e.button!==0) return;
        eDeget = (e.pointerType!=='mouse');
        amDeschisMeniu=false;
        x0=e.clientX;y0=e.clientY;
        t=setTimeout(()=>{
          t=null;
          amDeschisMeniu=true;
          try{ if(navigator.vibrate) navigator.vibrate(18); }catch(_){}
          fn(e);
        },520);
      });
      const gata=()=>{if(t){clearTimeout(t);t=null;}};
      el.addEventListener('pointerup',gata);
      el.addEventListener('pointercancel',gata);
      el.addEventListener('pointermove',e=>{
        const prag = eDeget ? 22 : 10;
        if(Math.abs(e.clientX-x0)>prag||Math.abs(e.clientY-y0)>prag) gata();
      });
      // pe iOS/Android apăsarea lungă cheamă meniul browserului — îl oprim,
      // dar NU oprim clicul obișnuit (altfel nimic nu mai răspunde la atingere)
      el.addEventListener('contextmenu',e=>{
        e.preventDefault();
        if(!eDeget){ e.stopPropagation(); fn(e); }   // pe mouse: clic-dreapta = meniul nostru
      });
      // dacă am deschis meniul prin apăsare lungă, înghițim clicul care urmează
      el.addEventListener('click',e=>{
        if(amDeschisMeniu){ e.stopPropagation(); e.preventDefault(); amDeschisMeniu=false; }
      },true);
    }

    // ---- meniu de jos ----
    function meniu(titlu, optiuni){
      // curăță orice meniu rămas (pe ecran, oriunde ar fi)
      document.querySelectorAll('.fm-meniu').forEach(x=>x.remove());
      const m=document.createElement('div'); m.className='fm-meniu';
      const c=document.createElement('div'); c.className='fm-meniu-c';
      if(titlu){const h=document.createElement('div');h.className='fm-meniu-t';h.textContent=titlu;c.appendChild(h);}
      for(const o of optiuni){
        const b=document.createElement('div'); b.className='fm-meniu-b'+(o.rosu?' rosu':'');
        b.textContent=o.text;
        // închidem meniul ÎNTÂI, apoi rulăm acțiunea (care poate deschide alt meniu)
        b.addEventListener('click',ev=>{
          ev.stopPropagation();
          m.remove();
          if(o.fn) setTimeout(()=>o.fn(),0);
        });
        c.appendChild(b);
      }
      const x=document.createElement('div'); x.className='fm-meniu-b anuleaza'; x.textContent='Anulează';
      x.addEventListener('click',ev=>{ev.stopPropagation(); m.remove();});
      c.appendChild(x); m.appendChild(c);
      m.addEventListener('click',e=>{if(e.target===m)m.remove();});
      document.body.appendChild(m);   // pe ecran, nu în fereastră
    }

    async function randeaza(){
      const toate=await Depozit.toate();
      root.querySelectorAll('.fm-bara,.fm-corp,.gol').forEach(x=>x.remove());
      document.querySelectorAll('.fm-meniu').forEach(x=>x.remove());

      const bara=document.createElement('div'); bara.className='fm-bara';
      if(caleCurenta){
        const inapoi=document.createElement('span'); inapoi.className='fm-inapoi'; inapoi.textContent='← înapoi';
        inapoi.addEventListener('click',()=>{caleCurenta='';randeaza();});
        // tragi un fișier pe „înapoi" → îl scoți din folder, în rădăcină
        inapoi.addEventListener('dragover',e=>{
          if(!window.__caleTrasa) return;
          e.preventDefault(); e.stopPropagation(); inapoi.classList.add('tinta');
        });
        inapoi.addEventListener('dragenter',e=>{
          if(!window.__caleTrasa) return;
          e.preventDefault(); inapoi.classList.add('tinta');
        });
        inapoi.addEventListener('dragleave',()=>inapoi.classList.remove('tinta'));
        inapoi.addEventListener('drop',async e=>{
          e.preventDefault(); e.stopPropagation();
          inapoi.classList.remove('tinta');
          let cale='';
          try{ cale=e.dataTransfer.getData('text/logos-fisier'); }catch(_){}
          if(!cale) cale = window.__caleTrasa || '';
          if(!cale) return;
          const f=await Depozit.gaseste(cale);
          if(f) await mutaIn(f, '');
        });
        bara.appendChild(inapoi);
      }
      const drum=document.createElement('span'); drum.className='fm-drum';
      drum.textContent='/acasă'+(caleCurenta?('/'+caleCurenta.replace(/\/$/,'')):'');
      bara.appendChild(drum);
      root.appendChild(bara);

      const foldere=new Set();
      for(const f of toate){
        if(f.tip==='folder') foldere.add(f.cale.replace(/\/$/,'')+'/');
        else if(f.cale.includes('/')) foldere.add(f.cale.split('/')[0]+'/');
      }
      const eDoc=x=>x.tip!=='folder'&&x.tip!=='html'&&x.tip!=='backup';

      // corp: grila de fișiere (fără panou lateral — fura spațiu în ferestre înguste)
      const corpFm=document.createElement('div'); corpFm.className='fm-corp';
      root.appendChild(corpFm);

      const grila=document.createElement('div'); grila.className='fm-grila';
      corpFm.appendChild(grila);
      apasareLunga(grila, e=>{
        if(e.target.closest('.fm-item')) return;
        meniu('Creează aici', [
          {text:'📁  Folder nou', fn:folderNou},
          {text:'▢  Fișier nou', fn:fisierNou},
        ]);
      });
      let gol=true;

      if(!caleCurenta){
        for(const fol of [...foldere].sort()){
          gol=false;
          const nr=toate.filter(x=>eDoc(x)&&x.cale.startsWith(fol)).length;
          const el=document.createElement('div'); el.className='fm-item';
          const rec=toate.find(x=>x.tip==='folder'&&x.cale===fol);
          el.innerHTML=`<div class="fm-ic-folder">${rec&&rec.parola?'<span class="fm-lacat">🔒</span>':''}</div><div class="fm-nume">${escHtml(fol.replace(/\/$/,''))}</div><div class="fm-meta">${nr} fișier(e)</div>`;
          el.addEventListener('click',()=>intraInFolder(fol));
          apasareLunga(el,()=>meniuFolder(fol));
          // ---- primește fișiere trase peste el ----
          el.addEventListener('dragover',e=>{
            if(!window.__caleTrasa) return;
            e.preventDefault(); e.stopPropagation();
            e.dataTransfer.dropEffect='move';
            el.classList.add('tinta');
          });
          el.addEventListener('dragenter',e=>{
            if(!window.__caleTrasa) return;
            e.preventDefault(); el.classList.add('tinta');
          });
          el.addEventListener('dragleave',()=>el.classList.remove('tinta'));
          el.addEventListener('drop',async e=>{
            e.preventDefault(); e.stopPropagation();
            el.classList.remove('tinta');
            let cale='';
            try{ cale=e.dataTransfer.getData('text/logos-fisier'); }catch(_){}
            if(!cale) cale = window.__caleTrasa || '';
            if(!cale) return;
            const f=await Depozit.gaseste(cale);
            if(f) await mutaIn(f, fol);
          });
          grila.appendChild(el);
        }
        const rad=toate.filter(x=>eDoc(x)&&!x.cale.includes('/'));
        rad.sort((a,b)=>a.cale.localeCompare(b.cale));
        for(const f of rad){gol=false;grila.appendChild(itemFisier(f,f.cale));}
      } else {
        const din=toate.filter(x=>eDoc(x)&&x.cale.startsWith(caleCurenta));
        din.sort((a,b)=>a.cale.localeCompare(b.cale));
        for(const f of din){gol=false;grila.appendChild(itemFisier(f,f.cale.slice(caleCurenta.length)));}
      }

      if(gol || (!grila.children.length)){
        const g=document.createElement('div'); g.className='gol';
        g.innerHTML=caleCurenta?'Folderul e gol.\nȚine apăsat pe gol ca să creezi ceva.':'Niciun fișier aici.\nȚine apăsat pe gol (sau clic-dreapta) ca să creezi.';
        grila.appendChild(g);
      }
    }

    function itemFisier(f, numeAfisat){
      const ext=f.cale.includes('.')?('.'+f.cale.split('.').pop().toLowerCase().slice(0,4)):'';
      const el=document.createElement('div'); el.className='fm-item';
      el.innerHTML=`<div class="fm-ic-fisier">${f.parola?'<span class="fm-lacat">🔒</span>':''}<span class="fm-ext">${escHtml(ext)}</span></div>
        <div class="fm-nume">${escHtml(numeAfisat)}</div><div class="fm-meta">${volumFis(f.continut)}</div>`;
      el.addEventListener('click',()=>deschideCuApp(f));
      apasareLunga(el,()=>meniuFisier(f));
      // ---- tragere: DOAR cu mouse. Pe atingere, „draggable" fură apăsarea lungă. ----
      if(areMouse()){
        el.draggable=true;
        el.addEventListener('dragstart',e=>{
          e.dataTransfer.setData('text/logos-fisier', f.cale);
          e.dataTransfer.setData('text/plain', f.cale);
          e.dataTransfer.effectAllowed='all';
          window.__caleTrasa = f.cale;
          el.classList.add('se-trage');
          document.body.classList.add('trag-fisier');
        });
        el.addEventListener('dragend',()=>{
          window.__caleTrasa = null;
          el.classList.remove('se-trage');
          document.body.classList.remove('trag-fisier');
          document.querySelectorAll('.tinta,.term-tinta').forEach(x=>x.classList.remove('tinta','term-tinta'));
        });
      }
      return el;
    }

    async function intraInFolder(fol){
      const rec=(await Depozit.toate()).find(x=>x.tip==='folder'&&x.cale===fol);
      if(rec&&rec.parola){
        const p=prompt('Parola pentru '+fol.replace(/\/$/,'')+':');
        if(p===null) return;
        if(p!==rec.parola){ alert('Parolă greșită.'); return; }
      }
      caleCurenta=fol; randeaza();
    }

    function meniuFisier(f){
      meniu(f.cale, [
        {text:'Deschide', fn:()=>deschideCuApp(f)},
        {text:'Redenumește', fn:()=>redenumesteFisier(f)},
        {text:'Mută în folder…', fn:()=>alegeMutare(f)},
        {text:f.parola?'Scoate parola':'Pune parolă', fn:()=>paroleaza(f)},
        {text:'Șterge', rosu:true, fn:async()=>{
          if(!confirm('Ștergi „'+f.cale+'"?')) return;
          await Depozit.sterge(f.cale); randeaza();
        }},
      ]);
    }
    async function redenumesteFisier(f){
      if(f.parola){
        const v=prompt('Parola pentru '+f.cale+':');
        if(v===null) return;
        if(v!==f.parola){ alert('Parolă greșită.'); return; }
      }
      const baza=f.cale.split('/').pop();
      const folder=f.cale.includes('/')?f.cale.slice(0,f.cale.lastIndexOf('/')+1):'';
      let nume=prompt('Nume nou:', baza);
      if(!nume) return; nume=nume.trim();
      if(!nume || nume===baza) return;
      if(!nume.includes('.') && baza.includes('.')) nume+='.'+baza.split('.').pop();
      const nou=folder+nume;
      if(await Depozit.gaseste(nou)){ alert('Există deja un fișier cu numele ăsta.'); return; }
      const v=f.cale; await Depozit.sterge(v); f.cale=nou; await Depozit.scrie(f);
      randeaza();
    }
    async function meniuFolder(fol){
      const toate=await Depozit.toate();
      let rec=toate.find(x=>x.tip==='folder'&&x.cale===fol);
      meniu(fol.replace(/\/$/,''), [
        {text:'Deschide', fn:()=>intraInFolder(fol)},
        {text:'Redenumește', fn:()=>redenumesteFolder(fol, rec)},
        {text:(rec&&rec.parola)?'Scoate parola':'Pune parolă', fn:async()=>{
          if(!rec){ rec={cale:fol,tip:'folder',continut:'',creat:Date.now()}; }
          await paroleaza(rec);
        }},
        {text:'Șterge folderul (cu tot)', rosu:true, fn:async()=>{
          const cate=toate.filter(x=>x.tip!=='folder'&&x.cale.startsWith(fol)).length;
          if(!confirm('Ștergi folderul „'+fol.replace(/\/$/,'')+'" și cele '+cate+' fișier(e) din el?')) return;
          for(const x of toate){ if(x.cale===fol||x.cale.startsWith(fol)) await Depozit.sterge(x.cale); }
          if(caleCurenta===fol) caleCurenta='';
          randeaza();
        }},
      ]);
    }
    async function redenumesteFolder(fol, rec){
      if(rec&&rec.parola){
        const v=prompt('Parola pentru folderul '+fol.replace(/\/$/,'')+':');
        if(v===null) return;
        if(v!==rec.parola){ alert('Parolă greșită.'); return; }
      }
      const vechiNume=fol.replace(/\/$/,'');
      let nume=prompt('Nume nou pentru folder:', vechiNume);
      if(!nume) return; nume=nume.trim().replace(/\/+$/,'');
      if(!nume || nume===vechiNume) return;
      const nouFol=nume+'/';
      const toate=await Depozit.toate();
      if(toate.some(x=>x.cale===nouFol || x.cale.startsWith(nouFol))){ alert('Există deja un folder cu numele ăsta.'); return; }
      // mută toate fișierele din folder + intrarea folderului
      for(const x of toate){
        if(x.cale===fol){ await Depozit.sterge(x.cale); x.cale=nouFol; await Depozit.scrie(x); }
        else if(x.cale.startsWith(fol)){ const rest=x.cale.slice(fol.length); await Depozit.sterge(x.cale); x.cale=nouFol+rest; await Depozit.scrie(x); }
      }
      if(caleCurenta===fol) caleCurenta=nouFol;
      randeaza();
    }
    async function paroleaza(f){
      if(f.parola){
        const v=prompt('Parola actuală (ca să o scoți):');
        if(v===null) return;
        if(v!==f.parola){ alert('Parolă greșită.'); return; }
        delete f.parola;
        await Depozit.scrie(f);
        alert('Parola a fost scoasă.');
      } else {
        const p=prompt('Parola nouă (Atenție: e un lacăt, nu un seif — nu uita parola):');
        if(!p) return;
        f.parola=p;
        await Depozit.scrie(f);
      }
      randeaza();
    }
    async function alegeMutare(f){
      const toate=await Depozit.toate();
      const foldere=new Set();
      for(const x of toate){
        if(x.tip==='folder') foldere.add(x.cale.replace(/\/$/,'')+'/');
        else if(x.cale.includes('/')) foldere.add(x.cale.split('/')[0]+'/');
      }
      const opt=[{text:'⌂  acasă (rădăcină)', fn:()=>mutaIn(f,'')}];
      for(const fol of [...foldere].sort()){
        opt.push({text:'📁  '+fol.replace(/\/$/,''), fn:()=>mutaIn(f,fol)});
      }
      meniu('Mută „'+f.cale+'" în:', opt);
    }
    async function mutaIn(f, folder){
      const baza=f.cale.split('/').pop();
      const nou=folder+baza;
      if(nou===f.cale){ return; }
      if(await Depozit.gaseste(nou)){ alert('Există deja un fișier cu numele ăsta acolo.'); return; }
      const v=f.cale; await Depozit.sterge(v); f.cale=nou; await Depozit.scrie(f);
      randeaza();
    }
    async function folderNou(){
      let nume=prompt('Numele folderului:');
      if(!nume) return; nume=nume.trim().replace(/\/+$/,'');
      if(!nume) return;
      const cale=nume+'/';
      if(await Depozit.gaseste(cale)){ alert('Există deja.'); return; }
      const rec={cale,tip:'folder',continut:'',creat:Date.now()};
      const p=prompt('Parolă pentru folder (lasă gol dacă nu vrei):');
      if(p) rec.parola=p;
      await Depozit.scrie(rec); randeaza();
    }
    async function fisierNou(){
      let nume=prompt('Numele fișierului (ex: note.md):');
      if(!nume) return; nume=nume.trim();
      if(!nume) return;
      if(!nume.includes('.')) nume+='.md';
      const cale=caleCurenta+nume;
      if(await Depozit.gaseste(cale)){ alert('Există deja.'); return; }
      const tip=nume.endsWith('.md')?'md':nume.endsWith('.html')?'html':'text';
      const f={cale,tip,continut:'',creat:Date.now()};
      const p=prompt('Parolă pentru fișier (lasă gol dacă nu vrei):');
      if(p) f.parola=p;
      await Depozit.scrie(f); randeaza();
    }
  }
});

/* ---------- PROPRIETATE: care aplicație ține care fișier ----------
   Aplicațiile tale nu sunt răuvoitoare, dar se pot călca pe picioare: două
   care salvează amândouă „note.md" se rescriu una pe alta, în tăcere.
   Regula: primul care scrie un fișier îl ia în grijă. Altcineva trebuie să
   te întrebe pe tine. Cititul rămâne liber — e același seif, iar aplicațiile
   se folosesc unele de datele altora. */
const Proprietate = (()=>{
  function harta(){ return (Memorie.ia().proprietari)||{}; }
  function granturi(){ return (Memorie.ia().granturi)||{}; }
  function cine(cale){ return harta()[cale]||null; }
  async function revendica(cale, app){
    const h={...harta()}; h[cale]=app;
    await Memorie.salveaza({proprietari:h});
  }
  async function elibereaza(cale){
    const h={...harta()}; delete h[cale];
    await Memorie.salveaza({proprietari:h});
  }
  function arePermisiune(app, cale){ return !!granturi()[app+' → '+cale]; }
  async function permite(app, cale){
    const g={...granturi()}; g[app+' → '+cale]=true;
    await Memorie.salveaza({granturi:g});
  }
  return {cine, revendica, elibereaza, arePermisiune, permite, harta, granturi};
})();

/* ---------- CĂUTARE: index invers ----------
   Înainte, fiecare căutare decripta tot depozitul. Acum ținem o hartă
   cuvânt → fișiere, construită o dată și actualizată la fiecare scriere.
   Indexul stă în memorie cât ține sesiunea; nu ajunge pe disc, deci nu
   are cum să scurgă conținut și nu poate rămâne nesincronizat cu depozitul. */
const Cautare = (()=>{
  let index=new Map();          // cuvânt -> Set de căi
  let gata=false;
  const MIN=2;                  // cuvintele de o literă nu ajută la nimic

  // fără diacritice și fără majuscule: „Ștefan" se găsește scriind „stefan"
  function simplu(s){
    return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

  // Simplificare CU hartă de poziții.
  // Nu putem presupune că textul simplificat are aceeași lungime ca originalul:
  // dacă diacriticele vin descompuse în fișier („s"+semn separat, cum ajung din
  // multe surse), simplificarea scurtează textul și toate pozițiile de după alunecă.
  // Harta spune, pentru fiecare literă simplificată, unde stă în textul adevărat.
  function simpluCuHarta(text){
    const t=String(text==null?'':text);
    let rez='';
    const catre=[];                 // indice în rez -> indice în t
    for(let i=0;i<t.length;i++){
      const bucata=t[i].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      for(let k=0;k<bucata.length;k++){ rez+=bucata[k]; catre.push(i); }
    }
    catre.push(t.length);           // capăt, ca să putem cere și sfârșitul ultimei potriviri
    return {simplu:rez, catre, brut:t};
  }
  // traduce o potrivire din textul simplificat înapoi în textul adevărat
  function inapoi(harta, start, sfarsit){
    const s=harta.catre[start]!==undefined ? harta.catre[start] : harta.brut.length;
    const e=harta.catre[sfarsit]!==undefined ? harta.catre[sfarsit] : harta.brut.length;
    return [s, e];
  }

  // Singurul loc care caută potriviri într-un text. Îl folosesc și rezultatele,
  // și evidențierea din vizualizator — dacă ar fi două căutări separate, ar putea
  // ajunge să nu fie de acord între ele, exact cum s-a întâmplat deja o dată.
  // Fiecare potrivire e VERIFICATĂ: decupăm din textul adevărat și ne uităm dacă,
  // simplificat, chiar dă ce am căutat. Dacă nu, corectăm capetele. Așa marcajul
  // nu mai poate cădea lângă cuvânt, oricât de ciudat ar fi scris textul.
  function potriviriIn(brut, tipar, maxim=200){
    const harta=simpluCuHarta(brut);
    const re=new RegExp(tipar,'g');
    const gasite=[]; let m;
    while((m=re.exec(harta.simplu)) && gasite.length<maxim){
      if(m[0].length===0){ re.lastIndex++; continue; }
      const tinta=m[0];
      let [s,e]=inapoi(harta, m.index, m.index+tinta.length);

      // verificare + corecție: întindem sau strângem capătul până se potrivește
      if(simplu(brut.slice(s,e))!==tinta){
        let reparat=false;
        for(let d=1; d<=4 && !reparat; d++){
          for(const [s2,e2] of [[s,e+d],[s,e-d],[s-d,e],[s-d,e+d]]){
            if(s2<0 || e2>brut.length || e2<=s2) continue;
            if(simplu(brut.slice(s2,e2))===tinta){ s=s2; e=e2; reparat=true; break; }
          }
        }
        if(!reparat) continue;    // mai bine nicio evidențiere decât una greșită
      }
      gasite.push([s,e]);
    }
    return gasite;
  }

  // construiește tiparul pentru o interogare: cuvintele pot fi despărțite
  // de orice (spații multiple, rânduri noi, semne de punctuație).
  // Aici păstrăm ȘI cuvintele de o literă. Indexul nu le ține (ar umfla harta
  // fără folos), dar în frază contează: fără „i", tiparul pentru
  // „promis ca-i platesc" nu mai putea acoperi „-i " și nu găsea nimic.
  function bucatiTipar(interogare){
    return simplu(interogare).split(/[^a-z0-9]+/).filter(Boolean);
  }
  function tiparPentru(interogare){
    const parti=bucatiTipar(interogare);
    if(!parti.length) return null;
    return parti.map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('[^a-z0-9]+');
  }
  function cuvinte(text){
    return simplu(text).split(/[^a-z0-9]+/).filter(c=>c.length>=MIN);
  }

  function scoate(cale){
    for(const set of index.values()) set.delete(cale);
  }
  function adauga(f){
    if(!f || f.tip==='folder' || typeof f.continut!=='string') return;
    if(f.ascuns || /^__/.test(f.cale)) return;              // fișierele de sistem nu se caută
    if(typeof f.continut==='string' && f.continut.startsWith('⚠')) return;
    const toate=new Set(cuvinte(f.cale).concat(cuvinte(f.continut)));
    for(const c of toate){
      if(!index.has(c)) index.set(c, new Set());
      index.get(c).add(f.cale);
    }
  }
  function actualizeaza(f){
    if(!gata) return;
    scoate(f.cale);
    adauga(f);
  }
  function uita(cale){ if(gata) scoate(cale); }

  async function construieste(){
    index=new Map();
    const toate=await Depozit.toate();
    for(const f of toate) adauga(f);
    gata=true;
    return {fisiere:toate.length, cuvinte:index.size};
  }
  function esteGata(){ return gata; }
  function statistici(){ return {cuvinte:index.size}; }

  // Caută o frază: intersectăm listele cuvintelor (indexul îngustează rapid),
  // apoi verificăm textul adevărat, fiindcă indexul nu știe ordinea cuvintelor.
  async function cauta(interogare, limita=200){
    if(!gata) await construieste();
    const q=(interogare||'').trim();
    if(!q) return [];
    // Indexul ține doar cuvintele de cel puțin două litere, așa că îngustăm
    // după ele. Dacă interogarea e formată numai din cuvinte de o literă
    // („n-a", „o zi"), indexul nu ne ajută — trecem prin tot depozitul.
    const parti=cuvinte(q);
    let candidati=null;
    if(!parti.length){
      if(!tiparPentru(q)) return [];
      candidati=new Set((await Depozit.toate())
        .filter(f=>f.tip!=='folder' && !f.ascuns && !/^__/.test(f.cale))
        .map(f=>f.cale));
    }
    for(const c of parti){
      // prefix: „scri" găsește „scriu", „scrisoare" — util când nu ții minte forma exactă
      let potriviri=index.get(c);
      if(!potriviri){
        potriviri=new Set();
        for(const [cuv,set] of index) if(cuv.startsWith(c)) for(const cale of set) potriviri.add(cale);
      }
      candidati = candidati===null ? new Set(potriviri)
                                   : new Set([...candidati].filter(x=>potriviri.has(x)));
      if(!candidati.size) return [];
    }

    const qSimplu=simplu(q);
    const rezultate=[];
    // un singur cuvânt sau o frază: același tipar, aceeași cale de cod
    const tipar=tiparPentru(q);
    if(!tipar) return [];

    for(const cale of candidati){
      const f=await Depozit.gaseste(cale);
      if(!f || typeof f.continut!=='string') continue;
      const potriviriAici=potriviriIn(f.continut, tipar, 50)
                            .map(([s,e])=>({poz:s, lung:e-s}));

      const inNume=simplu(f.cale).includes(qSimplu);
      if(!potriviriAici.length && !inNume) continue;

      rezultate.push({
        cale:f.cale, tip:f.tip, inNume,
        cateOri:potriviriAici.length,
        potriviri:potriviriAici,
        fragment: potriviriAici.length ? fragmentDin(f.continut, potriviriAici[0]) : '',
        continut:f.continut
      });
      if(rezultate.length>=limita) break;
    }

    // întâi ce e în nume, apoi ce apare mai des
    rezultate.sort((a,b)=> (b.inNume?1:0)-(a.inNume?1:0) || b.cateOri-a.cateOri);
    return rezultate;
  }

  // decupăm în jurul potrivirii, fără să tăiem cuvintele la jumătate
  function fragmentDin(text, potrivire){
    const RAZA=60;
    let s=Math.max(0, potrivire.poz-RAZA);
    let e=Math.min(text.length, potrivire.poz+potrivire.lung+RAZA);
    if(s>0){ const sp=text.indexOf(' ', s); if(sp>=0 && sp<potrivire.poz) s=sp+1; }
    if(e<text.length){ const sp=text.lastIndexOf(' ', e); if(sp>potrivire.poz+potrivire.lung) e=sp; }
    return {
      inainte:(s>0?'…':'')+text.slice(s, potrivire.poz).replace(/\s+/g,' '),
      potrivit:text.slice(potrivire.poz, potrivire.poz+potrivire.lung).replace(/\s+/g,' '),
      dupa:text.slice(potrivire.poz+potrivire.lung, e).replace(/\s+/g,' ')+(e<text.length?'…':'')
    };
  }

  return {construieste, cauta, actualizeaza, uita, esteGata, statistici, simplu,
          simpluCuHarta, inapoi, potriviriIn, tiparPentru, fragmentDin};
})();

/* ---------- LEGĂTURI: [[nume]] ----------
   Scrii [[Bunici]] într-o însemnare și devine o trimitere pe care o atingi.
   Ținem ambele direcții: încotro trimite un fișier, și cine trimite spre el.
   Firele înapoi sunt partea valoroasă — arată legături pe care nu le-ai plănuit.
   Ca și indexul de căutare, harta stă în memorie și se actualizează la scriere. */
const Legaturi = (()=>{
  const TIPAR=/\[\[([^\[\]\n]{1,120})\]\]/g;
  let catre=new Map();          // cale -> Set de nume țintă (așa cum sunt scrise)
  let dinspre=new Map();        // nume normalizat -> Set de căi care trimit acolo
  let gata=false;

  // „Bunici", „bunici.md", „Jurnal/Bunici" — toate duc la același loc.
  // Iar „Bunici#prispa" duce în Bunici, exact la cuvântul „prispa”.
  // „prispa aceea|Bunici#prispa" arată cuvintele TALE, dar duce tot acolo —
  // așa textul se citește firesc, nu presărat cu nume de fișiere.
  function despicaTinta(nume){
    let t=String(nume||'');
    let eticheta='';
    const bara=t.indexOf('|');
    if(bara>=0){ eticheta=t.slice(0,bara).trim(); t=t.slice(bara+1); }
    const d=t.indexOf('#');
    if(d<0) return {eticheta, fisier:t.trim(), loc:''};
    return {eticheta, fisier:t.slice(0,d).trim(), loc:t.slice(d+1).trim()};
  }
  function cheie(nume){
    let n=despicaTinta(nume).fisier;
    n=n.replace(/\.(md|markdown|txt)$/i,'');      // extensia nu contează
    n=n.split('/').pop();                          // nici folderul
    return Cautare.simplu(n);
  }
  function extrage(text){
    if(typeof text!=='string') return [];
    const rez=[]; let m;
    TIPAR.lastIndex=0;
    while((m=TIPAR.exec(text))){
      const nume=m[1].trim();
      if(nume) rez.push(nume);
    }
    return rez;
  }

  function scoate(cale){
    const vechi=catre.get(cale);
    if(vechi){
      for(const t of vechi){
        const set=dinspre.get(cheie(t));
        if(set){ set.delete(cale); if(!set.size) dinspre.delete(cheie(t)); }
      }
    }
    catre.delete(cale);
  }
  /* `[[…]]` înseamnă legătură doar în text scris de om.
     În codul unei aplicații, `[["ft","ft"]]` e o listă de liste, iar
     `[[0,1,65535]]` o matrice — nu trimiteri. Citindu-le pe toate la fel,
     verificarea raporta drept legături stricate bucăți de JavaScript.
     Așa că întrebăm întâi ce fel de fișier e. */
  function eTextDeCitit(f){
    if(!f || f.tip==='folder' || typeof f.continut!=='string') return false;
    if(f.ascuns || /^__/.test(f.cale)) return false;
    if(f.tip==='html' || f.tip==='backup' || f.tip==='versiune') return false;
    const cale=f.cale||'';
    if(cale.includes('.')){
      const ext=(cale.split('.').pop()||'').toLowerCase();
      if(!['md','markdown','txt','text','note'].includes(ext)) return false;
    }
    // fișiere fără extensie: ne uităm la ce e înăuntru
    const cap=f.continut.slice(0,300).toLowerCase();
    if(cap.includes('<!doctype') || cap.includes('<html') || cap.includes('<script')) return false;
    return true;
  }
  function adauga(f){
    if(!eTextDeCitit(f)) return;
    const tinte=extrage(f.continut);
    if(!tinte.length) return;
    catre.set(f.cale, new Set(tinte));
    for(const t of tinte){
      const k=cheie(t);
      if(!dinspre.has(k)) dinspre.set(k, new Map());
      // reținem și trimiterea așa cum e scrisă: din ea știm, la întoarcere,
      // în ce loc din fișierul-sursă să aterizăm
      dinspre.get(k).set(f.cale, t);
    }
  }
  function actualizeaza(f){ if(gata){ scoate(f.cale); adauga(f); } }
  function uita(cale){ if(gata) scoate(cale); }

  async function construieste(){
    catre=new Map(); dinspre=new Map();
    for(const f of await Depozit.toate()) adauga(f);
    gata=true;
  }
  function esteGata(){ return gata; }

  // găsește fișierul spre care trimite [[nume]]; null dacă încă nu există
  async function rezolva(nume){
    const k=cheie(nume);
    const toate=await Depozit.toate();
    return toate.find(f=>f.tip!=='folder' && cheie(f.cale)===k) || null;
  }
  function iesiri(cale){ return Array.from(catre.get(cale)||[]); }
  function intrari(cale){
    // cine trimite spre fișierul ăsta, și cu ce trimitere anume — ca la
    // întoarcere să aterizăm exact pe cuvântul din care pleacă legătura
    const m=dinspre.get(cheie(cale));
    if(!m) return [];
    return Array.from(m.entries())
      .filter(([sursa])=>sursa!==cale)
      .map(([sursa, trimitere])=>({cale:sursa, trimitere}));
  }
  // trimiteri către fișiere care nu există încă — începuturi de însemnări
  function nerezolvate(toateCaile){
    const existente=new Set(toateCaile.map(cheie));
    const lipsa=new Map();
    for(const [cale,tinte] of catre){
      for(const t of tinte){
        if(!existente.has(cheie(t))){
          if(!lipsa.has(t)) lipsa.set(t, new Set());
          lipsa.get(t).add(cale);
        }
      }
    }
    return lipsa;
  }

  return {extrage, actualizeaza, uita, construieste, esteGata, rezolva,
          iesiri, intrari, nerezolvate, cheie, despicaTinta, eTextDeCitit, TIPAR};
})();

/* ---------- INDICATOR DE ERORI ----------
   Când o aplicație se plânge, semnul apare în bara de titlu a ferestrei —
   nu peste conținut, unde ar acoperi butoanele aplicației. Se deschide doar
   la apăsare, iar dacă nu e nimic de spus nu se vede deloc. */
function indicatorEroare(corp, titlu){
  let nr=0, semn=null, panou=null, inchide=null;

  function construieste(){
    if(semn) return;
    const fereastra=corp.closest ? corp.closest('.fereastra') : null;
    const cap=fereastra ? fereastra.querySelector('.cap-fereastra') : null;

    semn=document.createElement('span');
    semn.textContent='⚠';
    semn.title='diagnostic';
    semn.style.cssText='cursor:pointer;color:#f85149;font-size:.85rem;padding:4px 6px;'+
      'opacity:.75;flex-shrink:0';
    if(cap) cap.insertBefore(semn, cap.querySelector('.x'));
    else { semn.style.cssText+=';position:absolute;right:34px;top:6px;z-index:5'; corp.appendChild(semn); }

    panou=document.createElement('div');
    panou.style.cssText='display:none;position:absolute;left:0;right:0;bottom:0;z-index:60;'+
      'max-height:45%;overflow:auto;background:#2b1113;border-top:1px solid #f85149;'+
      'color:#ffb3ae;font:12px/1.5 var(--mono);padding:8px 10px 32px;white-space:pre-wrap;'+
      '-webkit-user-select:text;user-select:text';
    inchide=document.createElement('button');
    inchide.textContent='✕ ascunde';
    inchide.style.cssText='position:absolute;right:8px;bottom:6px;background:transparent;'+
      'border:none;color:#f85149;font:11px var(--mono);cursor:pointer';
    panou.appendChild(inchide);
    corp.appendChild(panou);

    semn.addEventListener('click',()=>{ panou.style.display='block'; });
    inchide.addEventListener('click',()=>{ panou.style.display='none'; });
  }

  function arata(text){
    construieste();
    nr++;
    semn.title=nr+' problemă/probleme în „'+(titlu||'aplicație')+'"';
    if(nr>12) return;                     // nu ne inundăm dacă intră în buclă
    const r=document.createElement('div');
    r.textContent=text;
    panou.insertBefore(r, inchide);
    panou.scrollTop=panou.scrollHeight;
  }
  return {arata};
}

/* ---------- FEREASTRĂ CĂTRE APLICAȚIILE INTERNE ----------
   Modulele de mai sus sunt declarate cu `const`, iar `const` la nivel de script
   NU devine proprietate a lui window. O aplicație internă (iframe, același
   origin) ajunge la ele prin `window.parent`, deci trebuie așezate explicit
   acolo. Fără linia asta, `parent.Depozit` e undefined și aplicația pornește
   frumos, dar nu poate salva nimic — fără niciun semn că ceva e greșit. */
window.Cripto=Cripto; window.Depozit=Depozit; window.Memorie=Memorie;
window.Nucleu=Nucleu; window.Proprietate=Proprietate;

/* ============================================================
   PUNTEA OASPETE ↔ SISTEM
   Orice aplicație .html rulează ca oaspete într-o fereastră Logos.
   Implicit e izolată (sigură), dar Logos îi întinde o punte:
   dacă aplicația vrea, poate cere/salva/lista fișiere din depozit.

   Contract (mesaje postMessage de la oaspete către Logos):
     {logos:'cere-fisier'}              → primește fișierul asociat
     {logos:'salveaza', continut, nume} → salvează în depozit
     {logos:'listeaza'}                 → primește lista fișierelor
     {logos:'gata'}                     → oaspetele e gata (trimitem fișierul)
   Logos răspunde oaspetelui cu:
     {logos:'fisier', continut, nume}
     {logos:'salvat', nume}
     {logos:'lista', fisiere:[...]}
   ============================================================ */

// rulează un oaspete (.html) într-o fereastră, cu puntea activă.
// fisierAsociat (opțional): fișierul pe care oaspetele îl deschide.
function ruleazaOaspete(numeApp, cod, fisierAsociat){
  // ACCES DEPLIN: excepție aleasă de tine, per aplicație (vezi „Aplicații" → ⛨).
  // Unele aplicații au nevoie de IndexedDB sau de Workeri, iar izolarea le refuză.
  // Cu acces deplin merg — dar văd tot Logos. De folosit doar pentru aplicații
  // care NU ating internetul.
  const deplin = !!((Memorie.ia().aplicatiiDeplin||{})[numeApp]);
  deschideFereastra('▷ '+numeApp,(corp)=>{
    const wrap=document.createElement('div');
    wrap.style.cssText='flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;position:relative';

    const ifr=document.createElement('iframe');
    // IZOLARE REALĂ: fără `allow-same-origin`.
    // Cu el, oaspetele era same-origin cu Logos și putea atinge direct
    // parent.Depozit (fișiere decriptate), parent.Cripto (cheia master) și
    // localStorage — adică sandbox-ul nu exista. Acum are origine opacă:
    // nu vede nimic din Logos, comunică doar prin punte (postMessage).
    ifr.setAttribute('sandbox','allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock allow-downloads'+(deplin?' allow-same-origin':''));
    // GPS-ul trece prin punte, nu direct: o origine opacă nu poate primi
    // permisiunea de geolocație de la browser. `allow` de mai jos folosește
    // doar aplicațiilor cu acces deplin, care au origine adevărată.
    ifr.setAttribute('allow','geolocation');
    ifr.style.cssText='flex:1;width:100%;border:none;background:#fff';
    wrap.appendChild(ifr);

    // ---- RAPORTUL DE ERORI ----
    // Semnul stă în bara de titlu a ferestrei, nu peste conținut: altfel s-ar
    // suprapune peste butoanele aplicației, exact unde e mai enervant.
    // Apare doar dacă e ceva de spus, și se deschide numai la apăsare.
    const raport=indicatorEroare(corp, '▷ '+numeApp);
    const aratoEroare=raport.arata;
    corp.appendChild(wrap);

    // Folosim `srcdoc`, nu `blob:`. Un blob: aparține originii Logos, așa că
    // trebuia `allow-same-origin` ca să se încarce — exact permisiunea care
    // spărgea izolarea. srcdoc merge cu origine opacă, deci nu mai e nevoie.
    //
    // Într-un iframe cu origine opacă, browserul refuză localStorage
    // („Access is denied"), iar aplicația moare (pagină albă). Le dăm o cămară
    // proprie, ținută în memoria ferestrei și salvată în Logos, criptată cu
    // aceeași cheie master ca restul sistemului. (Peticul de mai jos era cod
    // mort până acum: cu allow-same-origin, localStorage real funcționa și
    // datele oaspeților ajungeau pe disc NECRIPTATE. Acum se activează.)
    const cheieCamara = 'camara_oaspete_'+numeApp;

    let adresaBlob=null;   // folosită doar în modul acces deplin

    // pornirea e async (trebuie să decriptăm cămara înainte să construim iframe-ul),
    // dar deschideFereastra așteaptă o funcție de curățenie *sincronă* mai jos —
    // de-asta lucrul async stă izolat aici, într-un IIFE separat.
    (async()=>{
      let camara={};
      try{
        const brut=localStorage.getItem(cheieCamara);
        if(brut) camara=JSON.parse(await Cripto.decripteaza(brut));
      }catch(e){ camara={}; }

      const petic = `<script>
      (function(){
        var CHEIE=${JSON.stringify(cheieCamara)};
        var ADRESA_GAZDA=${JSON.stringify(location.href.split('#')[0])};
        function raporteaza(text){
          try{ parent.postMessage({logosEroare:CHEIE, text:String(text).slice(0,600)},'*'); }catch(e){}
        }
        // orice eroare netratată din oaspete ajunge la Logos, altfel moare în tăcere
        window.addEventListener('error', function(ev){
          if(ev.target && ev.target!==window && ev.target.src){
            var u=String(ev.target.src||'');
            // un src gol se rezolvă la adresa documentului gazdă: zgomot, nu defect
            if(!u || u.split('#')[0]===ADRESA_GAZDA) return;
            raporteaza('nu s-a putut încărca: '+u);
            return;
          }
          if(!ev.message && !ev.error) return;
          raporteaza((ev.message||'eroare')+'  ('+(ev.filename||'srcdoc')+':'+(ev.lineno||'?')+')');
        }, true);
        window.addEventListener('unhandledrejection', function(ev){
          var m=ev.reason; raporteaza('promisiune respinsă: '+((m&&(m.message||m))||'necunoscut'));
        });
        // cămară falsă, ca aplicația să nu moară în iframe sandboxed
        var date = ${JSON.stringify(camara)};
        function salveaza(){
          try{ parent.postMessage({logosCamara:CHEIE, date:date},'*'); }catch(e){}
        }
        var falsa = {
          getItem: function(k){ return Object.prototype.hasOwnProperty.call(date,k) ? String(date[k]) : null; },
          setItem: function(k,v){ date[String(k)]=String(v); salveaza(); },
          removeItem: function(k){ delete date[String(k)]; salveaza(); },
          clear: function(){ date={}; salveaza(); },
          key: function(i){ return Object.keys(date)[i] || null; },
          get length(){ return Object.keys(date).length; }
        };
        try{
          var proba = window.localStorage; proba.getItem('x');   // merge? îl lăsăm în pace
        }catch(e){
          try{ Object.defineProperty(window,'localStorage',{value:falsa,configurable:true}); }catch(_){}
          try{ Object.defineProperty(window,'sessionStorage',{value:falsa,configurable:true}); }catch(_){}
        }
        // API-uri pe care originea opacă le refuză — le prindem ca să știm exact ce cere aplicația
        try{
          var idb=window.indexedDB;
          if(idb && idb.open){
            var vechi=idb.open.bind(idb);
            idb.open=function(){ raporteaza('aplicația cere indexedDB — blocat de izolare'); return vechi.apply(idb, arguments); };
          }
        }catch(e){ raporteaza('indexedDB inaccesibil — blocat de izolare'); }
        try{
          if(window.Worker){
            var W=window.Worker;
            window.Worker=function(u){ raporteaza('aplicația cere un Worker ('+String(u).slice(0,80)+') — deseori blocat de izolare'); return new W(u); };
          }
        }catch(e){}

        // ---- GPS prin punte ----
        // O origine opacă nu poate primi permisiunea de geolocație de la browser.
        // Punem în loc un navigator.geolocation care cere poziția de la Logos,
        // el având origine adevărată. Aplicația nu observă diferența:
        // aceleași metode, aceleași obiecte de poziție și de eroare.
        (function(){
          var ceruri={}, urmariri={}, nrCerere=0;
          function pozitiaLogos(p){
            return {coords:{latitude:p.lat, longitude:p.lon, accuracy:p.acc,
                            altitude:p.alt, altitudeAccuracy:p.altAcc,
                            heading:p.dir, speed:p.viteza},
                    timestamp:p.cand};
          }
          function eroareLogos(e){
            return {code:e.code||2, message:e.message||'Poziția nu e disponibilă.',
                    PERMISSION_DENIED:1, POSITION_UNAVAILABLE:2, TIMEOUT:3};
          }
          window.addEventListener('message', function(ev){
            var d=ev.data;
            if(!d || d.logosGps!==CHEIE) return;
            var set = (d.fel==='urmarire') ? urmariri : ceruri;
            var c = set[d.id];
            if(!c) return;
            if(d.eroare){ if(c.laEroare) c.laEroare(eroareLogos(d.eroare)); }
            else if(c.laReusita){ c.laReusita(pozitiaLogos(d.pozitie)); }
            if(d.fel!=='urmarire') delete ceruri[d.id];
          });
          function cere(fel, id, optiuni){
            try{
              parent.postMessage({logosGps:CHEIE, cerere:fel, id:id,
                                  optiuni:{precis:!!(optiuni&&optiuni.enableHighAccuracy),
                                           rabdare:(optiuni&&optiuni.timeout)||0,
                                           vechime:(optiuni&&optiuni.maximumAge)||0}}, '*');
            }catch(e){}
          }
          var gpsFals = {
            getCurrentPosition: function(laReusita, laEroare, optiuni){
              var id=++nrCerere;
              ceruri[id]={laReusita:laReusita, laEroare:laEroare};
              cere('o-data', id, optiuni);
            },
            watchPosition: function(laReusita, laEroare, optiuni){
              var id=++nrCerere;
              urmariri[id]={laReusita:laReusita, laEroare:laEroare};
              cere('urmarire', id, optiuni);
              return id;
            },
            clearWatch: function(id){
              delete urmariri[id];
              try{ parent.postMessage({logosGps:CHEIE, cerere:'opreste', id:id}, '*'); }catch(e){}
            }
          };
          try{ Object.defineProperty(navigator,'geolocation',{value:gpsFals, configurable:true}); }
          catch(e){ try{ navigator.geolocation=gpsFals; }catch(_){ raporteaza('nu am putut lega GPS-ul la punte'); } }
        })();
      })();
      <\/script>`;

      const codCuPetic = cod.replace(/<head([^>]*)>/i, '<head$1>'+petic);
      const codFinal = (codCuPetic!==cod) ? codCuPetic : (petic + cod);

      // în izolare: srcdoc (blob: ar cere allow-same-origin).
      // în acces deplin: blob:, ca înainte — unele aplicații au nevoie de o adresă reală.
      if(deplin){
        try{
          const pachet=new Blob([codFinal],{type:'text/html'});
          adresaBlob=URL.createObjectURL(pachet);
          ifr.src=adresaBlob;
        }catch(e){ ifr.srcdoc=codFinal; }
      } else {
        ifr.srcdoc=codFinal;
      }
    })();

    // ascultăm salvările din cămara oaspetelui — criptăm înainte să atingă discul
    function laCamara(ev){
      if(ev.source!==ifr.contentWindow) return; // altfel, o aplicație deschisă în paralel putea otrăvi cămara acesteia
      const d=ev.data;
      if(d && d.logosEroare===cheieCamara && typeof d.text==='string'){ aratoEroare(d.text); return; }
      if(!d || d.logosCamara!==cheieCamara) return;
      (async()=>{
        try{
          const criptat=await Cripto.encripteaza(JSON.stringify(d.date||{}));
          localStorage.setItem(cheieCamara, criptat);
        }catch(e){}
      })();
    }
    window.addEventListener('message', laCamara);

    // ---- SERVICIUL GPS ----
    // Oaspetele nu poate cere poziția direct (origine opacă), așa că o cerem noi
    // și i-o trimitem. Permisiunea se cere o singură dată per aplicație; browserul
    // și-o cere separat pe a lui, tot o dată, pentru originea Logos.
    const urmaririGps=new Map();     // idOaspete -> idWatch al browserului
    function trimiteGps(id, fel, pozitie, eroare){
      const msg={logosGps:cheieCamara, id, fel};
      if(eroare) msg.eroare={code:eroare.code, message:eroare.message};
      else msg.pozitie={lat:pozitie.coords.latitude, lon:pozitie.coords.longitude,
                        acc:pozitie.coords.accuracy, alt:pozitie.coords.altitude,
                        altAcc:pozitie.coords.altitudeAccuracy,
                        dir:pozitie.coords.heading, viteza:pozitie.coords.speed,
                        cand:pozitie.timestamp};
      raspunde(msg);
    }
    async function laGps(ev){
      if(ev.source!==ifr.contentWindow) return;
      const d=ev.data;
      if(!d || d.logosGps!==cheieCamara || !d.cerere) return;

      if(d.cerere==='opreste'){
        const w=urmaririGps.get(d.id);
        if(w!==undefined){ navigator.geolocation.clearWatch(w); urmaririGps.delete(d.id); }
        return;
      }
      if(!navigator.geolocation){
        trimiteGps(d.id, d.cerere, null, {code:2, message:'Dispozitivul nu are geolocație.'});
        return;
      }
      // permisiunea ta, cerută o singură dată per aplicație
      if(!Proprietate.arePermisiune(numeApp, '@gps')){
        const ok=confirm('„'+numeApp+'" cere accesul la locația ta'+
          (d.cerere==='urmarire' ? ', în continuu cât e deschisă.' : '.')+'\n\nPermiți?');
        if(!ok){
          trimiteGps(d.id, d.cerere, null, {code:1, message:'Ai refuzat accesul la locație.'});
          return;
        }
        await Proprietate.permite(numeApp, '@gps');
      }
      const opt={enableHighAccuracy:!!(d.optiuni&&d.optiuni.precis),
                 timeout:(d.optiuni&&d.optiuni.rabdare)||30000,
                 maximumAge:(d.optiuni&&d.optiuni.vechime)||0};
      if(d.cerere==='urmarire'){
        if(urmaririGps.has(d.id)) return;                       // deja pornită
        const w=navigator.geolocation.watchPosition(
          p=>trimiteGps(d.id,'urmarire',p,null),
          e=>trimiteGps(d.id,'urmarire',null,e), opt);
        urmaririGps.set(d.id, w);
      } else {
        navigator.geolocation.getCurrentPosition(
          p=>trimiteGps(d.id,'o-data',p,null),
          e=>trimiteGps(d.id,'o-data',null,e), opt);
      }
    }
    window.addEventListener('message', laGps);

    // puntea: ascultă mesajele DOAR de la acest iframe
    function raspunde(msg){ try{ ifr.contentWindow.postMessage(msg,'*'); }catch(e){} }
    async function laMesaj(ev){
      if(ev.source!==ifr.contentWindow) return; // doar de la oaspetele nostru
      const d=ev.data||{};
      if(!d || typeof d.logos!=='string') return;
      try{
        if(d.logos==='gata' || d.logos==='cere-fisier'){
          if(fisierAsociat) raspunde({logos:'fisier', continut:fisierAsociat.continut||'', nume:fisierAsociat.cale});
        }
        else if(d.logos==='salveaza' && typeof d.continut==='string'){
          const cerut = d.nume || (fisierAsociat?fisierAsociat.cale:('document-'+Date.now()+'.md'));
          const nume = numeSigur(cerut);
          if(!nume){
            console.warn('Punte: nume refuzat de la oaspete:', cerut);
            raspunde({logos:'eroare', motiv:'nume-nepermis', nume:String(cerut).slice(0,40)});
            return;
          }
          // ---- PROPRIETATE: prima aplicație care scrie un fișier îl ia în grijă.
          // Altă aplicație nu mai poate scrie peste el fără să te întrebe pe tine.
          // Excepție firească: fișierul pe care TU l-ai deschis cu aplicația asta.
          const stapan = Proprietate.cine(nume);
          const eAsociat = !!(fisierAsociat && fisierAsociat.cale===nume);
          if(stapan && stapan!==numeApp && !eAsociat){
            if(!Proprietate.arePermisiune(numeApp, nume)){
              const ok = confirm('„'+numeApp+'" vrea să scrie în „'+nume+'".\n\n'+
                'Fișierul ăsta e ținut de „'+stapan+'". Dacă permiți, conținutul de acum '+
                'poate fi înlocuit.\n\nPermiți? (întreb o singură dată)');
              if(!ok){
                raspunde({logos:'eroare', motiv:'alt-proprietar', nume, proprietar:stapan});
                return;
              }
              await Proprietate.permite(numeApp, nume);
            }
          }
          const ex = await Depozit.gaseste(nume);
          // ---- PLASĂ DE SIGURANȚĂ: ținem versiunea de dinainte, una singură.
          // O aplicație cu o eroare nu-ți mai poate distruge conținutul definitiv.
          // Se aduce înapoi din Terminal:  recupereaza <nume>
          if(ex && typeof ex.continut==='string' && ex.continut && ex.continut!==d.continut){
            try{
              await Depozit.scrie({cale:'__ver1:'+nume, tip:'versiune', ascuns:true,
                                   creat:Date.now(), continut:ex.continut});
            }catch(e){ console.warn('Punte: nu am putut păstra versiunea veche', e); }
          }
          const f = ex || {cale:nume, tip:(nume.split('.').pop()||'text'), creat:Date.now()};
          f.continut=d.continut;
          await Depozit.scrie(f);
          if(!stapan) await Proprietate.revendica(nume, numeApp);
          if(fisierAsociat && fisierAsociat.cale===f.cale) fisierAsociat.continut=d.continut;
          raspunde({logos:'salvat', nume:f.cale});
        }
        else if(d.logos==='listeaza'){
          const t=await Depozit.toate();
          raspunde({logos:'lista', fisiere:t.map(x=>({nume:x.cale, tip:x.tip}))});
        }
      }catch(e){ console.warn('Punte oaspete:',e); }
    }
    window.addEventListener('message',laMesaj);
    // curățenie când fereastra se închide
    return ()=>{
      window.removeEventListener('message',laMesaj);
      window.removeEventListener('message',laCamara);
      window.removeEventListener('message',laGps);
      // GPS-ul continuu ține radioul aprins: dacă uităm să-l oprim, mănâncă bateria
      // în fundal chiar și după ce fereastra a dispărut de pe ecran.
      urmaririGps.forEach(w=>{ try{ navigator.geolocation.clearWatch(w); }catch(e){} });
      urmaririGps.clear();
      if(adresaBlob){ try{ URL.revokeObjectURL(adresaBlob); }catch(e){} }
    };
  },{}, {appId:'oaspete:'+numeApp+(fisierAsociat?(':'+fisierAsociat.cale):''), iconita:'▷'});
}

/* ---------- ASOCIERI: ce oaspete deschide ce tip de fișier ----------
   Poți instala o aplicație .html și o desemnezi handler pentru o extensie
   prin terminal: `asociaza md AplicatiaMea.html`. Altfel, text simplu. */
async function deschideCuApp(f, evidentiaza){
  // fișier cu parolă → cere-o (lacăt, nu seif — conținutul nu e criptat)
  if(f.parola){
    const p=prompt('Parola pentru '+f.cale+':');
    if(p===null) return;
    if(p!==f.parola){ alert('Parolă greșită.'); return; }
  }
  // un .html e o aplicație-oaspete → o rulează direct
  if(f.tip==='html'){ ruleazaOaspete(f.cale, f.continut); return; }
  // caută un handler instalat pentru extensie (din memoria sistemului)
  const ext=(f.cale||'').toLowerCase().split('.').pop();
  const asoc=(Memorie.ia().asocieri)||{};
  const numeApp=asoc[ext];
  if(numeApp){
    const app=(await Depozit.toate()).find(x=>x.tip==='html' && x.cale===numeApp);
    if(app){ ruleazaOaspete(app.cale, app.continut, f); return; }
  }
  // rezervă: vizualizare text cu fundal reglabil (aceleași teme)
  deschideVizualizareSimpla(f, evidentiaza);
}

// vizualizare text/markdown cu paletă completă (ca aplicația ta model)
// Paletele sunt un punct de plecare rapid; pentru orice altceva, panoul are
// și alegere liberă de culoare. Ordinea merge de la noapte la hârtie.
const PALETA_BG_VIZ=['#000000','#0d1117','#111418','#1a1410','#16302b','#1e2530','#241c2e','#2a2620',
                     '#3a3326','#4a4038','#5c5346','#8b8378','#c9bfad','#dcd3c0','#e9dfc9','#f1e9db',
                     '#f3efe6','#f7f3ea','#fdfaf3','#ffffff'];
const PALETA_INK_VIZ=['#ffffff','#f0f6fc','#c9d1d9','#dfeae3','#e3d3bd','#d9c9a3','#58a6ff','#7ee787',
                      '#d9a441','#e0777d','#b58acc','#9a6a2f','#6b5b45','#4a4238','#3a3326','#2a2620',
                      '#1c1c1c','#000000'];
// preferințe de citire, ținute în memoria sistemului
let prefViz = { bg:'#0d1117', text:'#c9d1d9', accent:'#58a6ff', font:18, lh:1.7,
                lumina:0, lumText:0, cald:0, lat:100 };
function incarcaPrefViz(){
  const s=Memorie.ia();
  if(s&&s.vizPref2) prefViz={...prefViz,...s.vizPref2};
  // înainte, un singur cursor mișca și fondul, și textul — nu puteai închide
  // fondul păstrând textul luminos. Aducem vechea setare fără s-o pierdem.
  if(prefViz.lumText===undefined) prefViz.lumText=Math.round((prefViz.lumina||0)*0.3);
  if(prefViz.cald===undefined) prefViz.cald=0;
  if(prefViz.lat===undefined) prefViz.lat=100;
}
// lumină + căldură: căldura mută spre chihlimbar sau spre albastru,
// util seara, când albul rece obosește ochiul
function culoareViz(hex, lum, cald){
  let h=hex.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join('');
  let r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  const d=(lum/100)*255, c=(cald||0)/100*255;
  const t=v=>Math.max(0,Math.min(255,Math.round(v)));
  const hx=v=>v.toString(16).padStart(2,'0');
  return '#'+hx(t(r+d+c))+hx(t(g+d+c*0.35))+hx(t(b+d-c*0.6));
}
function tonHex(hex, cant){
  let h=hex.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join('');
  let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const aj=v=>Math.max(0,Math.min(255,Math.round(v+(cant/100)*255)));
  const hx=v=>v.toString(16).padStart(2,'0');
  return '#'+hx(aj(r))+hx(aj(g))+hx(aj(b));
}
// e poziția asta deja înăuntrul unei legături [[...]]?
// (verificare simplă și sigură: ne uităm după ultima deschidere înainte de ea)
function inLegatura(text, poz){
  const deschis=text.lastIndexOf('[[', poz);
  if(deschis<0) return false;
  const inchis=text.indexOf(']]', deschis);
  return inchis>=0 && inchis>=poz;
}

// Un fișier poate fi schimbat din altă fereastră (de pildă când desfacem
// celălalt capăt al unei legături). Fereastra lui, dacă e deschisă, ține în
// memorie versiunea veche: ar arăta legătura încă vie, iar la următoarea
// salvare ar scrie-o la loc. O punem la curent pe loc.
function improspateazaFereastra(cale){
  const intrare=ferestreDeschise.find(x=>x.appId==='viz:'+cale);
  if(intrare && intrare.laReafisare){
    try{ intrare.laReafisare({}); }catch(e){ console.warn(e); }
  }
}

function deschideVizualizareSimpla(f, evidentiaza){
  const eMd=/\.(md|markdown)$/i.test(f.cale);

        <div class="ts-rand"><label>Fondul (închide ← → deschide)</label><div class="ts-ctrl"><input type="range" class="viz-lumina" min="-50" max="50" step="1"><span class="ts-val viz-luminaV"></span></div></div>
        <div class="ts-rand"><label>Culoare text</label><div class="viz-swInk ed-sw2"></div>

        <div class="ts-rand"><label>Lățimea textului</label><div class="ts-ctrl"><input type="range" class="viz-lat" min="30" max="130" step="5"><span class="ts-val viz-latV"></span></div></div>
        <div class="term-setari-x viz-panou-x">gata</div>
      </div>`;
    c.appendChild(root);
    root.querySelector('.viz-nume').textContent=f.cale;
    const corpV=root.querySelector('.viz-corp');
    const panou=root.querySelector('.viz-panou');
    const btnEdit=root.querySelector('.viz-edit');
    let mod='citire';          // 'citire' | 'editare'
    let salvTimer=null;

    function md2htmlLocal(md){
      const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return md.split('\n').map(l=>{
        let t=l.trim();
        if(t.startsWith('## '))return '<h2>'+esc(t.slice(3))+'</h2>';
        if(t.startsWith('# '))return '<h1>'+esc(t.slice(2))+'</h1>';
        if(t.startsWith('> '))return '<blockquote>'+esc(t.slice(2))+'</blockquote>';
        if(/^[-*+]\s/.test(t))return '<li>'+esc(t.replace(/^[-*+]\s/,''))+'</li>';
        if(t==='')return '';
        return '<p>'+esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>')+'</p>';
      }).join('');
    }
    // salvare automată (ca în modelul tău: scrii, se salvează singur)
    // Dar acum se și vede: la scris lung, „s-a salvat?" e întrebarea care te scoate din text.
    let semnSalvare=null;
    function aratoStareSalvare(text, culoare){
      if(!semnSalvare) return;
      semnSalvare.textContent=text;
      semnSalvare.style.color=culoare||'inherit';
      semnSalvare.style.opacity=text?'.75':'0';
    }
    function programeazaSalvare(){
      clearTimeout(salvTimer);
      aratoStareSalvare('…', prefViz.accent);
      salvTimer=setTimeout(async()=>{
        try{
          await Depozit.scrie(f);
          aratoStareSalvare('salvat', prefViz.accent);
          setTimeout(()=>aratoStareSalvare('', ''), 1400);
        }catch(e){
          // dacă salvarea eșuează, trebuie să afli imediat, nu când e prea târziu
          aratoStareSalvare('NESALVAT', '#f85149');
        }
      },500);
    }
    function numaraCuvinte(t){
      const c=(t||'').trim();
      if(!c) return '0 cuvinte';
      const n=c.split(/\s+/).length;
      return n+(n===1?' cuvânt':' cuvinte');
    }
    // Recolorează ce e deja pe ecran, FĂRĂ să reconstruiască textul.
    // Asta e cheia: la mișcarea unui cursor nu se mai reface nimic, deci
    // tastatura nu mai sare și nu-ți pierzi locul din text.
    function coloreazaMd(){
      const txt=culoareViz(prefViz.text, prefViz.lumText, prefViz.cald);
      const ac=prefViz.accent;
      const s=corpV.querySelector('.vd');
      if(!s) return;
      s.querySelectorAll('h1').forEach(h=>{h.style.color=txt;h.style.fontSize='1.6em';h.style.margin='.3em 0 .5em'});
      s.querySelectorAll('h2').forEach(h=>{h.style.color=ac;h.style.fontSize='1.3em';h.style.margin='1em 0 .3em'});
      s.querySelectorAll('p').forEach(p=>p.style.margin='0 0 .9em');
      s.querySelectorAll('blockquote').forEach(b=>{b.style.borderLeft='2px solid '+ac;b.style.paddingLeft='14px';b.style.opacity='.85';b.style.fontStyle='italic';b.style.margin='0 0 .9em'});
      s.querySelectorAll('code').forEach(cc=>{cc.style.background=ac+'22';cc.style.padding='.1em .4em';cc.style.borderRadius='4px'});
      s.querySelectorAll('strong').forEach(x=>x.style.color=txt);
      s.querySelectorAll('li').forEach(li=>{li.style.margin='.3em 0 .3em 1.2em'});
    }

    /* ---------- CINE TRIMITE AICI ----------
       Legăturile se scriu în text, deci le vezi pe cele care pleacă. Cele care
       vin nu se vedeau nicăieri decât din terminal — iar ele sunt jumătatea
       care face dintr-un teanc de însemnări o țesătură. Banda stă jos, strânsă
       cât nu e nimic de arătat, și te duce înapoi exact la cuvântul din care
       pleacă trimiterea, nu la începutul fișierului. */
    async function randeazaIntrari(){
      const banda=root.querySelector('.viz-intrari');
      if(!banda) return;
      banda.innerHTML='';
      if(mod==='editare'){ banda.style.display='none'; return; }
      let veniri=[];
      try{
        if(!Legaturi.esteGata()) await Legaturi.construieste();
        veniri=Legaturi.intrari(f.cale)||[];
      }catch(e){}
      if(!veniri.length){ banda.style.display='none'; return; }
      banda.style.display='';

      const cap=document.createElement('div');
      cap.style.cssText='font-size:.72rem;opacity:.5;text-transform:uppercase;letter-spacing:.07em;padding:9px 0 5px';
      cap.textContent='⟵ trimit aici · '+veniri.length;
      banda.appendChild(cap);

      const sir=document.createElement('div');
      sir.style.cssText='display:flex;flex-wrap:wrap;gap:7px;padding-bottom:10px';
      for(const v of veniri){
        // `trimitere` e ținta așa cum e scrisă în celălalt fișier: „Bunici#prispa”.
        // Ancora de acolo e cuvântul DE AICI spre care s-a legat.
        const parti=Legaturi.despicaTinta(String(v.trimitere||''));
        const scurt=(v.cale||'').split('/').pop().replace(/\.(md|markdown|txt)$/i,'');
        const p=document.createElement('span');
        p.style.cssText='display:inline-flex;align-items:baseline;gap:5px;max-width:100%;'+
          'padding:6px 11px;border:1px solid '+prefViz.accent+'44;border-radius:999px;'+
          'font-size:.82rem;cursor:pointer;overflow:hidden';
        p.innerHTML='<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(scurt)+'</span>'+
                    (parti.loc?'<span style="opacity:.55;font-size:.9em;flex:none">› '+escHtml(parti.loc)+'</span>':'');
        p.addEventListener('click', async ()=>{
          const tf=await Depozit.gaseste(v.cale) || await Legaturi.rezolva(v.cale);
          if(!tf){ instiintare('Nu mai găsesc „'+v.cale+'".'); return; }
          // deschidem sursa și îi luminăm cuvântul din care pleacă trimiterea
          deschideCuApp(tf, parti.eticheta || parti.loc || '');
        });
        sir.appendChild(p);
      }
      banda.appendChild(sir);
    }

    function randeazaCorp(cuFocus){
      const bg=culoareViz(prefViz.bg, prefViz.lumina, prefViz.cald);
      const txt=culoareViz(prefViz.text, prefViz.lumText, prefViz.cald);
      const ac=prefViz.accent;
      if(mod==='editare'){
        corpV.innerHTML='';
        const ta=document.createElement('textarea');
        ta.className='viz-scriere';
        ta.value=f.continut||'';
        ta.spellcheck=false;
        ta.style.cssText='width:100%;min-height:calc(100% - 26px);border:none;outline:none;resize:none;'+
          'background:transparent;color:inherit;font:inherit;line-height:inherit;'+
          'padding:0;display:block;caret-color:'+prefViz.accent;
        // rândul de jos: cât ai scris și dacă s-a salvat — discret, nu în drum
        const josul=document.createElement('div');
        josul.style.cssText='display:flex;justify-content:space-between;align-items:center;'+
          'font-size:.72rem;opacity:.5;padding-top:8px;height:26px;box-sizing:border-box';
        const cate=document.createElement('span');
        cate.textContent=numaraCuvinte(ta.value);
        semnSalvare=document.createElement('span');
        semnSalvare.style.cssText='transition:opacity .3s;opacity:0;font-size:.72rem';
        josul.appendChild(cate); josul.appendChild(semnSalvare);

        ta.addEventListener('input',()=>{
          f.continut=ta.value;
          cate.textContent=numaraCuvinte(ta.value);
          programeazaSalvare();
        });
        corpV.appendChild(ta);
        corpV.appendChild(josul);
        // tastatura urcă doar când tu ceri să scrii, nu la fiecare redesenare
        if(cuFocus) setTimeout(()=>ta.focus(),150);
      } else if(eMd){
        corpV.innerHTML='<div class="vd">'+md2htmlLocal(f.continut||'')+'</div>';
        coloreazaMd();
      } else {
        corpV.innerHTML='<pre style="white-space:pre-wrap;font-family:inherit;margin:0">'+(f.continut||'(gol)').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>';
      }
      if(mod!=='editare'){
        faLegaturile();
        // lista „Trimit aici" nu se mai adaugă în josul paginii: legăturile
        // sunt acum în ambele sensuri chiar în text, deci era doar zgomot.
        // Cine vrea harta întreagă o are în Terminal:  legaturi <nume>
        if(evidentiaza) marcheazaGasitele();
      }
    }

    // ---- LEGĂTURI: [[nume]] devine atingibil ----
    function faLegaturile(){
      const plimbare=document.createTreeWalker(corpV, NodeFilter.SHOW_TEXT);
      const noduri=[]; let n;
      while((n=plimbare.nextNode())) noduri.push(n);
      // Aceeași legătură poate apărea de mai multe ori în același fișier.
      // Ținem minte a câta e fiecare, ca ștergerea s-o desfacă exact pe cea
      // apăsată, nu pe prima din text.
      const catVazute=new Map();

      for(const nod of noduri){
        if(nod.parentNode && nod.parentNode.classList &&
           nod.parentNode.classList.contains('leg')) continue;
        const brut=nod.nodeValue;
        if(brut.indexOf('[[')<0) continue;
        const re=new RegExp(Legaturi.TIPAR.source,'g');
        const bucata=document.createDocumentFragment();
        let de=0, m, ceva=false;
        while((m=re.exec(brut))){
          ceva=true;
          if(m.index>de) bucata.appendChild(document.createTextNode(brut.slice(de,m.index)));
          const brutInterior=m[1];              // exact cum e scris, pentru ștergere
          const rand=catVazute.get(brutInterior)||0;
          catVazute.set(brutInterior, rand+1);
          const nume=m[1].trim();
          const {eticheta, fisier, loc}=Legaturi.despicaTinta(nume);
          const a=document.createElement('span');
          a.className='leg';
          // cuvintele tale, dacă le-ai dat; altfel ținta, citibil.
          // La [[#frază]] nu există nume de fișier: fără grija asta, eticheta
          // ieșea „ › frază", cu săgeata atârnând în gol.
          a.textContent = eticheta || (loc ? ((fisier?fisier+' › ':'')+loc) : fisier);
          // pastilă discretă, nu albastru de browser:
          // subliniere plină — se vede că e legătură fără să sară din text
          a.style.cssText='color:'+prefViz.accent+
            ';background:'+prefViz.accent+'16'+
            ';border-bottom:2px solid '+prefViz.accent+
            ';border-radius:3px;padding:0 3px;cursor:pointer;font-weight:500';
          a.addEventListener('click', async(ev)=>{
            ev.stopPropagation();
            // orice salt închide panoul de aspect: dacă rămâne deschis, acoperă
            // exact textul spre care tocmai ai sărit
            panou.classList.remove('deschis');
            if(!fisier){                       // [[#frază]] — un loc din fișierul curent
              if(loc){ evidentiaza=loc; randeazaCorp(false); }
              return;
            }
            const tinta=await Legaturi.rezolva(nume);
            if(tinta){ deschideCuApp(tinta, loc||''); return; }
            // trimiterea nu are încă un fișier — o poți porni chiar acum
            if(!confirm('„'+fisier+'" nu există încă.\n\nÎl creez?')) return;
            const cale=/\.[a-z0-9]{1,6}$/i.test(fisier) ? fisier : (fisier+'.md');
            const nou={cale, tip:cale.split('.').pop(), creat:Date.now(),
                       continut:'# '+fisier+'\n\n'+(loc?(loc+'\n'):'')};
            await Depozit.scrie(nou);
            deschideCuApp(nou, loc||'');
          });

          // apăsare lungă pe legătură → meniu
          let cronoLung=null, aFostLung=false;
          const porneste=()=>{
            aFostLung=false;
            clearTimeout(cronoLung);
            cronoLung=setTimeout(()=>{
              aFostLung=true;
              if(navigator.vibrate) { try{ navigator.vibrate(18); }catch(e){} }
              meniulLegaturii(a, brutInterior, {eticheta, fisier, loc}, rand);
            }, 520);
          };
          const opreste=()=>clearTimeout(cronoLung);
          a.addEventListener('touchstart', porneste, {passive:true});
          a.addEventListener('touchend', opreste);
          a.addEventListener('touchmove', opreste);
          a.addEventListener('touchcancel', opreste);
          a.addEventListener('contextmenu', ev=>ev.preventDefault());
          // dacă a fost apăsare lungă, nu mai sărim la țintă
          a.addEventListener('click', ev=>{ if(aFostLung){ ev.stopImmediatePropagation(); ev.preventDefault(); } }, true);

          bucata.appendChild(a);
          de=m.index+m[0].length;
        }
        if(!ceva) continue;
        if(de<brut.length) bucata.appendChild(document.createTextNode(brut.slice(de)));
        nod.parentNode.replaceChild(bucata, nod);
      }
    }

    /* ---- MENIUL LEGĂTURII (apăsare lungă) ----
       Un meniu mic lângă cuvânt, cu deschidere și ștergere.
       Ștergerea desface AMBELE capete — altfel ar rămâne o legătură care duce
       spre un cuvânt ce nu mai trimite înapoi. */
    function meniulLegaturii(elem, brutInterior, parti, rand){
      root.querySelectorAll('.leg-meniu').forEach(x=>x.remove());
      const m=document.createElement('div');
      m.className='leg-meniu';
      m.style.cssText='position:absolute;z-index:45;background:#161b22;color:#c9d1d9;'+
        'border:1px solid #30363d;border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.5);'+
        'padding:5px;min-width:190px;display:flex;flex-direction:column;gap:2px';

      function buton(text, culoare, laApasare){
        const b=document.createElement('button');
        b.textContent=text;
        b.style.cssText='background:none;border:none;text-align:left;padding:11px 13px;'+
          'font:inherit;font-size:.88rem;border-radius:7px;color:'+culoare+';cursor:pointer';
        b.addEventListener('click', ev=>{ ev.stopPropagation(); m.remove(); laApasare(); });
        return b;
      }

      if(parti.fisier){
        m.appendChild(buton('↦ Deschide ținta', prefViz.accent, async()=>{
          const t=await Legaturi.rezolva(brutInterior.trim());
          if(t) deschideCuApp(t, parti.loc||'');
        }));
      }
      m.appendChild(buton('🗑 Șterge legătura', '#f85149', ()=>stergeLegatura(brutInterior, parti, rand)));
      m.appendChild(buton('renunță', '#8b949e', ()=>{}));

      root.appendChild(m);
      // așezăm meniul lângă cuvânt, dar în interiorul ferestrei
      try{
        const d=elem.getBoundingClientRect(), dr=root.getBoundingClientRect();
        let sus=d.bottom-dr.top+6, stanga=d.left-dr.left;
        if(sus+150>root.clientHeight) sus=Math.max(6, d.top-dr.top-150);
        stanga=Math.max(8, Math.min(stanga, root.clientWidth-200));
        m.style.top=sus+'px'; m.style.left=stanga+'px';
      }catch(e){ m.style.top='60px'; m.style.left='20px'; }

      // o atingere în afară îl închide
      setTimeout(()=>{
        const inafara=ev=>{
          // meniul ăsta nu mai e în pagină: ascultătorul pleacă, fără să se
          // amestece în meniul care i-a luat locul
          if(!document.contains(m) || !m.contains(ev.target)){
            m.remove();
            document.removeEventListener('pointerdown', inafara, true);
          }
        };
        document.addEventListener('pointerdown', inafara, true);
      }, 60);
    }

    // desface legătura din fișierul acesta ȘI perechea ei din fișierul țintă
    async function stergeLegatura(brutInterior, parti, rand){
      const vizibil = parti.eticheta || (parti.loc ? (parti.fisier+' › '+parti.loc) : parti.fisier);
      if(!confirm('Ștergi legătura „'+vizibil+'"?\n\nSe desface din ambele fișiere; textul rămâne.')) return;

      // 1) aici: [[...]] → doar cuvintele, fără paranteze.
      //    A câta apariție a ei e, dacă legătura se repetă în text.
      const cautat='[['+brutInterior+']]';
      let text=f.continut||'';
      let poz=-1, de=0;
      for(let k=0;k<=(rand||0);k++){
        poz=text.indexOf(cautat, de);
        if(poz<0) break;
        de=poz+cautat.length;
      }
      if(poz<0) poz=text.indexOf(cautat);
      if(poz<0){ alert('Nu mai găsesc legătura în fișier.'); return; }
      // ce rămâne în text: cuvintele tale; la [[#loc]] nu există nici etichetă,
      // nici nume de fișier, iar fără `loc` pastila ar dispărea cu totul
      const ramane = parti.eticheta || parti.fisier || parti.loc || '';
      text=text.slice(0,poz)+ramane+text.slice(poz+cautat.length);
      f.continut=text;
      await Depozit.scrie(f);

      // 2) în fișierul țintă: perechea care trimite înapoi spre noi.
      //    Adunăm întâi TOATE legăturile de acolo care arată spre fișierul
      //    acesta, apoi alegem. Înainte ne opream la prima care semăna, așa
      //    că, între două fișiere legate de mai multe ori, se desfăcea altă
      //    pereche decât cea cerută — sau niciuna, și rămânea agățată.
      let siDincolo=false, numeDincolo='';
      if(parti.fisier){
        try{
          const tinta=await Legaturi.rezolva(parti.fisier);
          if(tinta){
            const tt=tinta.continut||'';
            const re=new RegExp(Legaturi.TIPAR.source,'g');
            const la=a=>Cautare.simplu(a||'');
            const candidati=[]; let mm;
            while((mm=re.exec(tt))){
              const p=Legaturi.despicaTinta(mm[1].trim());
              if(!p.fisier || Legaturi.cheie(p.fisier)!==Legaturi.cheie(f.cale)) continue;
              candidati.push({poz:mm.index, brut:mm[0], p});
            }
            // oglinda curată: eticheta ei e locul nostru, locul ei e eticheta noastră
            const oglinda = c => parti.loc && parti.eticheta &&
                                 la(c.p.eticheta)===la(parti.loc) &&
                                 la(c.p.loc)===la(parti.eticheta);
            // pe jumătate: se potrivește măcar un capăt (legături mai vechi,
            // scrise când perechea se făcea altfel)
            const jumatate = c => (parti.loc && la(c.p.eticheta)===la(parti.loc)) ||
                                  (parti.eticheta && la(c.p.loc)===la(parti.eticheta));
            const ales = candidati.find(oglinda) || candidati.find(jumatate) ||
                         (candidati.length===1 ? candidati[0] : null);
            if(ales){
              const gasitText=ales.p.eticheta||ales.p.fisier;
              tinta.continut=tt.slice(0,ales.poz)+gasitText+tt.slice(ales.poz+ales.brut.length);
              await Depozit.scrie(tinta);
              improspateazaFereastra(tinta.cale);
              siDincolo=true; numeDincolo=tinta.cale;
            } else {
              numeDincolo=tinta.cale;
            }
          }
        }catch(e){ console.warn('Nu am putut desface celălalt capăt', e); }
      }

      randeazaCorp(false);
      randeazaIntrari();
      // spunem limpede ce s-a întâmplat: o ștergere pe jumătate, în tăcere,
      // ar lăsa o legătură care duce spre un cuvânt ce nu mai trimite înapoi
      if(siDincolo) instiintare('Legătură ștearsă din ambele fișiere.');
      else if(numeDincolo) instiintare('Ștearsă aici. În „'+numeDincolo+'" nu am găsit perechea.');
      else instiintare('Legătură ștearsă.');
    }

    // ---- FIRELE ÎNAPOI: cine trimite spre însemnarea asta ----
    async function araFireleInapoi(){
      if(!Legaturi.esteGata()) await Legaturi.construieste();
      const dinspre=Legaturi.intrari(f.cale);

    // ---- EVIDENȚIERE: colorăm ce s-a căutat și sărim la prima apariție ----
    // Umblăm doar prin nodurile de text, ca să nu stricăm marcajul deja construit.
    function marcheazaGasitele(){
      const tipar=Cautare.tiparPentru(evidentiaza||'');
      if(!tipar) return;

      const plimbare=document.createTreeWalker(corpV, NodeFilter.SHOW_TEXT);
      const noduri=[]; let n;
      while((n=plimbare.nextNode())) noduri.push(n);

      let primul=null, primulOricare=null;
      for(const nod of noduri){
        const brut=nod.nodeValue;
        // aceeași funcție care a produs rezultatele căutării, deci marcajul
        // nu poate fi de altă părere decât lista de rezultate
        const locuri=Cautare.potriviriIn(brut, tipar, 100);
        if(!locuri.length) continue;
        // Eticheta unei legături conține chiar cuvântul spre care trimite.
        // Dacă săream la prima potrivire din pagină, un [[#libelulă]] pus sus
        // se găsea pe sine și rămâneai pe loc; unul pus jos părea că merge,
        // fiindcă adevăratul cuvânt îi era înainte. Marcăm și în etichete,
        // dar sărim la primul cuvânt din text, nu la o pastilă de legătură.
        const eEticheta = nod.parentNode && nod.parentNode.closest &&
                          !!nod.parentNode.closest('.leg');

        const bucata=document.createDocumentFragment();
        let de=0;
        for(const [s,e] of locuri){
          if(s<de) continue;                       // potriviri suprapuse: o luăm pe prima
          if(s>de) bucata.appendChild(document.createTextNode(brut.slice(de,s)));
          const marcaj=document.createElement('mark');
          marcaj.textContent=brut.slice(s,e);
          marcaj.style.cssText='background:'+prefViz.accent+'55;color:inherit;border-radius:3px;padding:0 2px';
          bucata.appendChild(marcaj);
          if(!primulOricare) primulOricare=marcaj;
          if(!primul && !eEticheta) primul=marcaj;
          de=e;
        }
        if(de<brut.length) bucata.appendChild(document.createTextNode(brut.slice(de)));
        nod.parentNode.replaceChild(bucata, nod);
      }
      // dacă vorba apare numai în etichete de legătură, măcar acolo sărim
      if(!primul) primul=primulOricare;
      if(primul){
        setTimeout(()=>{
          // Derulăm NUMAI cadrul textului. `scrollIntoView` derulează toți
          // părinții — inclusiv pe cei cu `overflow:hidden`, care se pot derula
          // programatic — și împingea bara ferestrei afară din ecran, lăsând
          // banda neagră dedesubt.
          try{
            const tinta=primul.offsetTop-(corpV.clientHeight/2)+(primul.offsetHeight/2);
            corpV.scrollTo({top:Math.max(0,tinta), behavior:'smooth'});
          }catch(e){ corpV.scrollTop=Math.max(0, primul.offsetTop-80); }
          primul.style.background=prefViz.accent+'aa';
          setTimeout(()=>{ primul.style.background=prefViz.accent+'55'; }, 1200);
        }, 120);
      }
    }

      // pe ecran lat, un rând prea lung obosește ochiul; îl putem strânge la mijloc.
